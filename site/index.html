<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Omnirefl is a C++ reflection tool without macros or undefined behavior.">
    <title>Omnirefl — C++ reflection without macros</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
          Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        --background: #ffffff;
        --border: #d0d7de;
        --code-background: #f6f8fa;
        --foreground: #1f2328;
        --link: #0969da;
        --scroll-offset: 4rem;
        color: var(--foreground);
        background: var(--background);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0d1117;
          --border: #30363d;
          --code-background: #161b22;
          --foreground: #e6edf3;
          --link: #58a6ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      /* omnirefl:highlight */

      html {
        scroll-behavior: smooth;
        scroll-padding-top: var(--scroll-offset);
      }

      body {
        margin: 0;
        line-height: 1.5;
        background: var(--background);
      }

      main {
        width: min(100% - 2rem, 60rem);
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      h1,
      h2,
      h3 {
        margin-top: 1.5rem;
        margin-bottom: 1rem;
        line-height: 1.25;
        color: var(--foreground);
        font-weight: 600;
      }

      h1 {
        margin-top: 0;
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--border);
        font-size: 2em;
      }

      h2 {
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--border);
        font-size: 1.5em;
      }

      h3 {
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--border);
        font-size: 1.25em;
      }

      p {
        margin-top: 0;
        margin-bottom: 1rem;
        color: var(--foreground);
      }

      blockquote {
        margin: 0 0 1rem;
        padding: 0 1rem;
        border-left: 0.25rem solid var(--border);
      }

      blockquote > :last-child {
        margin-bottom: 0;
      }

      ul,
      ol {
        margin-top: 0;
        margin-bottom: 1rem;
        padding-left: 2em;
      }

      li {
        color: var(--foreground);
      }

      a {
        color: var(--link);
      }

      a:focus-visible {
        border-radius: 0.15rem;
        outline: 2px solid var(--link);
        outline-offset: 0.2rem;
      }

      .site-nav {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        gap: 1rem;
        width: calc(100% + 2rem);
        margin: -2rem -1rem 1.5rem;
        padding: 0.75rem 1rem;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
        white-space: nowrap;
        background: var(--background);
        scrollbar-width: none;
      }

      .site-nav::-webkit-scrollbar {
        display: none;
      }

      .site-nav a {
        flex: none;
        color: var(--foreground);
        text-decoration: none;
      }

      .site-nav a:hover {
        text-decoration: underline;
      }

      .site-nav a[aria-current="location"] {
        color: var(--link);
        font-weight: 600;
      }

      .site-nav .source {
        margin-left: auto;
        color: var(--link);
      }

      @media (min-width: 90rem) {
        :root {
          --desktop-content-left:
            calc((100vw - 60rem) / 2 - clamp(2rem, 2vw, 4rem));
          --scroll-offset: 2rem;
        }

        main {
          width: min(100% - 2rem, 60rem);
          margin-right: 0;
          margin-left: var(--desktop-content-left);
        }

        .site-nav {
          position: fixed;
          top: 2rem;
          left: calc(var(--desktop-content-left) - 10rem);
          flex-direction: column;
          gap: 0.5rem;
          width: 9rem;
          margin: 0;
          padding: 0 0 0 0.75rem;
          overflow: visible;
          border-bottom: 0;
          border-left: 1px solid var(--border);
          font-size: 0.8125rem;
          white-space: normal;
          background: transparent;
        }

        .site-nav .source {
          margin: 1rem 0 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }

      img {
        max-width: 100%;
        height: auto;
      }

      p[align="center"] {
        text-align: center;
      }

      p[align="center"] img {
        width: min(100%, 48rem);
        vertical-align: middle;
      }

      pre {
        overflow-x: auto;
        margin-top: 0;
        margin-bottom: 1rem;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font-size: 85%;
        line-height: 1.45;
        background: var(--code-background);
      }

      pre code.hljs {
        padding: 0;
        background: transparent;
      }

      code {
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
      }

      :not(pre) > code {
        padding: 0.15rem 0.35rem;
        border-radius: 0.3rem;
        font-size: 85%;
        background: var(--code-background);
      }

    </style>
  </head>
  <body>
    <main>
      <nav class="site-nav" aria-label="Page sections">
        <a href="#introduction">Omnirefl</a>
        <a href="#sneak-peek">Sneak Peek</a>
        <a href="#experience">Seamless Experience</a>
        <a href="#scope">Supported Scope</a>
        <a href="#performance">Is It Slow?</a>
        <a href="#install">Install</a>
        <a href="#limitations">Limitations</a>
        <a href="#how-it-works">How It Works</a>
        <a class="source" href="https://github.com/sergio-eld/omnirefl">GitHub ↗</a>
      </nav>
      <!-- omnirefl:readme -->
    </main>
    <script type="module">
      const navigation = document.querySelector('.site-nav')
      const links = [...navigation.querySelectorAll('a[href^="#"]')]
      const sections = links.map(link => document.querySelector(link.hash))
      const desktop = window.matchMedia('(min-width: 90rem)')
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)')
      const scrollKeys = new Set([
        'ArrowDown',
        'ArrowUp',
        'End',
        'Home',
        'PageDown',
        'PageUp',
        ' ',
      ])
      let active
      let requested = sections.find(section => `#${section.id}` === location.hash)
      let scheduled = false

      const activate = () => {
        const offset = Number.parseFloat(
          window.getComputedStyle(document.documentElement).scrollPaddingTop) + 1
        const atBottom = Math.ceil(window.scrollY + window.innerHeight)
          >= document.documentElement.scrollHeight
        const current = requested
          ?? (atBottom
            ? sections[sections.length - 1]
            : sections.reduce((selected, section) =>
                section.getBoundingClientRect().top <= offset
                  ? section
                  : selected,
              sections[0]))

        if (current === active)
          return

        active = current
        const currentLink = links.find(link => link.hash === `#${current.id}`)

        links.forEach(link => {
          if (link === currentLink)
            link.setAttribute('aria-current', 'location')
          else
            link.removeAttribute('aria-current')
        })

        if (!desktop.matches && navigation.clientWidth < navigation.scrollWidth)
          navigation.scrollTo({
            behavior: reducedMotion.matches ? 'auto' : 'smooth',
            left: currentLink.offsetLeft
              - (navigation.clientWidth - currentLink.offsetWidth) / 2,
          })
      }

      const schedule = () => {
        if (scheduled)
          return

        scheduled = true
        window.requestAnimationFrame(() => {
          scheduled = false
          activate()
        })
      }

      const releaseRequested = () => {
        requested = undefined
        schedule()
      }

      links.forEach(link => link.addEventListener('click', () => {
        requested = sections.find(section => `#${section.id}` === link.hash)
        schedule()
      }))

      window.addEventListener('scroll', schedule, {passive: true})
      window.addEventListener('resize', schedule)
      window.addEventListener('wheel', releaseRequested, {passive: true})
      window.addEventListener('touchstart', releaseRequested, {passive: true})
      window.addEventListener('pointerdown', event => {
        if (!navigation.contains(event.target))
          releaseRequested()
      }, {passive: true})
      window.addEventListener('keydown', event => {
        if (scrollKeys.has(event.key))
          releaseRequested()
      })
      window.addEventListener('hashchange', () => {
        requested = sections.find(section => `#${section.id}` === location.hash)
        schedule()
      })
      activate()
    </script>
  </body>
</html>
