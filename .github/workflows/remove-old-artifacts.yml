name: Remove old artifacts

on:
  schedule:
    # Every day at 1am.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 10

    steps:
      - name: Remove old artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const master = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/master',
            })
            const masterShortSha = master.data.object.sha.substring(0, 12)
            const cutoffMs = Date.now() - 90 * 1000

            const belongsToActiveRun = async (artifact) => {
              if (!artifact.workflow_run)
                return false

              const run = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: artifact.workflow_run.id,
              })

              return 'completed' !== run.data.status
            }

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100})
            const isReleaseArtifact = (artifact) =>
              artifact.name.startsWith('packages-') ||
              artifact.name.startsWith('symbols-') ||
              artifact.name.startsWith('release-inputs-')
            const releaseArtifactSha = (artifact) =>
              isReleaseArtifact(artifact)
                ? artifact.name
                  .substring(artifact.name.lastIndexOf('-') + 1)
                  .substring(0, 12)
                : ''
            const packageCommitDate = new Map()
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith('packages-')) {
                continue
              }

              const sha = releaseArtifactSha(artifact)
              if ('' === sha || masterShortSha === sha) {
                continue
              }

              const createdAt = new Date(artifact.created_at).getTime()
              if (!packageCommitDate.has(sha) || packageCommitDate.get(sha) < createdAt) {
                packageCommitDate.set(sha, createdAt)
              }
            }

            const retainedReleaseShas = new Set([...packageCommitDate.entries()]
              .sort((lhs, rhs) => rhs[1] - lhs[1])
              .slice(0, 5)
              .map(([sha]) => sha))

            for (const artifact of artifacts) {
              const sha = releaseArtifactSha(artifact)
              const keep =
                artifact.name.startsWith('aggregated-test-results-') ||
                (
                  isReleaseArtifact(artifact) &&
                  masterShortSha === sha
                ) ||
                retainedReleaseShas.has(sha) ||
                (!isReleaseArtifact(artifact) &&
                  cutoffMs <= new Date(artifact.created_at).getTime())

              // Recheck immediately before deletion: a rerun may have started
              // after this cleanup collected its artifact candidates.
              if (keep || await belongsToActiveRun(artifact)) {
                core.info(`keeping artifact: ${artifact.name}`)
                continue
              }

              core.info(`deleting artifact: ${artifact.name}`)
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              })
            }
