name: Nightly native validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,6 * * *'
      timezone: Europe/Belgrade

concurrency:
  group: full-validation-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: Select nightly native validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.policy.outputs.full_suite }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install policy dependencies
        run: python3 -m pip install --quiet PyYAML==6.0.2
      - name: Select full suite
        id: policy
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(TZ=Europe/Belgrade date --iso-8601=seconds)
          printf 'Started: %s\nCommit: %s\n' "$started" "$GITHUB_SHA"
          printf '## Nightly native validation\n\nStarted: `%s`\n\nCommit: `%s`\n' \
            "$started" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          GITHUB_OUTPUT="$RUNNER_TEMP/native-packages.outputs" \
            python3 ci/reuse_ci.py full-inputs --wait-master --wait-active
          source "$RUNNER_TEMP/native-packages.outputs"
          if [ -n "$reused_full_run_id" ]; then
            echo 'full_suite=false' >> "$GITHUB_OUTPUT"
            selection="Full coverage: run $reused_full_run_id; build $reused_full_build_commit (unchanged inputs)"
          else
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            selection='Native packages require full validation'
          fi
          printf '%s\n' "$selection"
          printf '\n%s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$reused_full_run_id" ]; then
            printf '\n[Package source run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$reused_full_run_id" >> "$GITHUB_STEP_SUMMARY"
          fi

  validation:
    name: Nightly native full suite
    needs: select
    if: ${{ 'true' == needs.select.outputs.full_suite }}
    uses: ./.github/workflows/ci.yml
    with:
      build_sources: true
      full_suite: true
      native_packages: true
      skip_pages: true
    # Reusable CI's declared Pages ceiling applies even when deployment is skipped.
    permissions:
      actions: write
      contents: read
      pull-requests: read
      id-token: write
      pages: write
