name: Periodic full validation

on:
  schedule:
    - cron: '17 3 * * *'

# Avoid overlapping scheduled full runs.
concurrency:
  group: full-validation-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: Select periodic full validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.policy.outputs.full_suite }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select full suite
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          selection=$(python3 ci/full_validation.py --idle)
          printf '%s\n' "$selection"
          printf '## Full-suite cadence\n\n%s\n\n' "$selection" >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: Periodic full suite
    needs: select
    if: ${{ 'true' == needs.select.outputs.full_suite }}
    uses: ./.github/workflows/ci.yml
    with:
      build_sources: true
      full_suite: true
      skip_pages: true
    # Reusable CI's declared Pages ceiling applies even when deployment is skipped.
    permissions:
      actions: write
      contents: read
      pull-requests: read
      id-token: write
      pages: write
