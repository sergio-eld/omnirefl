name: Nightly native validation

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Belgrade

concurrency:
  group: full-validation-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: Select nightly native validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.policy.outputs.full_suite }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Select full suite
        id: policy
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITHUB_OUTPUT="$RUNNER_TEMP/native-packages.outputs" \
            python3 ci/reuse_ci.py find --native --wait-master --wait-active \
              --require-symbols --targets extras cosmo-universal \
              linux-x86_64-musl linux-aarch64-musl windows-x86_64-ucrt
          source "$RUNNER_TEMP/native-packages.outputs"
          if [ true = "$full_suite" ]; then
            echo 'full_suite=false' >> "$GITHUB_OUTPUT"
            selection="Native packages already passed full validation: run $run_id"
          else
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            selection='Native packages require full validation'
          fi
          printf '%s\n' "$selection"
          printf '## Nightly native validation\n\n%s\n' "$selection" >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: Nightly native full suite
    needs: select
    if: ${{ 'true' == needs.select.outputs.full_suite }}
    uses: ./.github/workflows/ci.yml
    with:
      build_sources: true
      full_suite: true
      native_packages: true
      skip_pages: true
    # Reusable CI's declared Pages ceiling applies even when deployment is skipped.
    permissions:
      actions: write
      contents: read
      pull-requests: read
      id-token: write
      pages: write
