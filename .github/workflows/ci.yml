  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    needs:
      - build-package-musl
      - build-package-cosmo
      - test-package-linux
      - test-package-macos
      - test-package-windows
    permissions:
      contents: read
      actions: write
    if: always()

    steps:
      - name: Find previous aggregate artifact
        id: previous_aggregate
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })

            const artifact = artifacts
              .filter(({name}) =>
                name.startsWith('aggregated-test-results-attempt-'))
              .sort((lhs, rhs) =>
                new Date(rhs.created_at) - new Date(lhs.created_at))[0]

            core.setOutput('name', artifact?.name ?? '')

      - name: Download previous aggregate artifact
        id: download_previous
        if: ${{ '' != steps.previous_aggregate.outputs.name }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.previous_aggregate.outputs.name }}
          path: ./test-results

      - name: Download test artifacts
        id: download_tests
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ./test-results

      - name: Upload aggregated test artifact
        id: upload_agg
        if: >-
          ${{
            always()
            && 'success' == steps.download_tests.outcome
            && (
              '' == steps.previous_aggregate.outputs.name
              || 'success' == steps.download_previous.outcome
            )
          }}
        uses: actions/upload-artifact@v6
        with:
          name: aggregated-test-results-attempt-${{ github.run_attempt }}
          path: ./test-results
          if-no-files-found: error

      - name: Clean up intermediate artifacts
        if: >-
          ${{
            always()
            && 'success' == steps.upload_agg.outcome
            && (
              'pull_request' != github.event_name
              || github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })

            for (const artifact of artifacts.filter(({name}) =>
              name.startsWith('test-'))) {
              core.info(`deleting intermediate artifact: ${artifact.name}`)
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              })
            }

      - name: Require successful package and test jobs
        if: >-
          ${{
            always()
            && (
              'success' != needs['build-package-musl'].result
              || 'success' != needs['build-package-cosmo'].result
              || 'success' != needs['test-package-linux'].result
              || 'success' != needs['test-package-macos'].result
              || 'success' != needs['test-package-windows'].result
            )
          }}
        env:
          BUILD_PACKAGE_MUSL_RESULT: ${{ needs['build-package-musl'].result }}
          BUILD_PACKAGE_COSMO_RESULT: ${{ needs['build-package-cosmo'].result }}
          TEST_PACKAGE_LINUX_RESULT: ${{ needs['test-package-linux'].result }}
          TEST_PACKAGE_MACOS_RESULT: ${{ needs['test-package-macos'].result }}
          TEST_PACKAGE_WINDOWS_RESULT: ${{ needs['test-package-windows'].result }}
        run: |
          printf 'build-package-musl: %s\nbuild-package-cosmo: %s\ntest-package-linux: %s\ntest-package-macos: %s\ntest-package-windows: %s\n' \
            "$BUILD_PACKAGE_MUSL_RESULT" \
            "$BUILD_PACKAGE_COSMO_RESULT" \
            "$TEST_PACKAGE_LINUX_RESULT" \
            "$TEST_PACKAGE_MACOS_RESULT" \
            "$TEST_PACKAGE_WINDOWS_RESULT"
          exit 1
