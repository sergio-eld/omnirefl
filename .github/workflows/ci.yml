name: CI
run-name: >-
  CI / ${{ github.event.pull_request.head.ref || github.ref_name }}
  / ${{ inputs.full_suite && 'full'
    || (github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && 'automatic'
    || 'smoke' }}

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full test suite (reuse exact-commit packages)
        type: boolean
        required: false
        default: false
      build_sources:
        description: Build packages, run package tests, and benchmark
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      full_suite:
        description: Run the full test suite (reuse exact-commit packages)
        type: boolean
        required: false
        default: false
      build_sources:
        description: Build packages, run package tests, and benchmark
        type: boolean
        required: false
        default: false
      skip_pages:
        description: Skip Pages deployment for internal validation calls
        type: boolean
        required: false
        default: false

# New PR commits replace older runs; other events keep independent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# CI coverage, grouped by distribution.
# TODO: [low] Define a schema for CI_MATRIX, validate against it, and extract
# parameters programmatically. Apply schema defaults explicitly before expansion.
env:
  CI_MATRIX: |
    # Currently the primary distribution: one package for Linux, macOS, and Windows.
    cosmo:
      build:
        # Readonly: packaging combines x86_64 and AArch64 into one universal package.
        arch: [universal]
        include:
          - arch: universal
            target: cosmo-universal
            service: build-cosmo
            runner: ubuntu-latest

      test:
        linux:
          distro: [alpine, ubuntu-18.04, ubuntu-20.04, ubuntu-22.04]
          arch: [x86_64, aarch64]
          toolchain: [gcc, clang, mingw]
          include:
            - {arch: x86_64, runner: ubuntu-latest}
            # Use a versioned native ARM runner; ubuntu-latest-arm is unavailable.
            - {arch: aarch64, runner: ubuntu-24.04-arm}
          # TODO: Publish and validate these ARM images, then remove the exclusions.
          exclude:
            # These older Ubuntu ARM image tags are not published in GHCR.
            - {arch: aarch64, distro: ubuntu-18.04}
            - {arch: aarch64, distro: ubuntu-20.04}
            # ARM Clang and MinGW image tags are not published in GHCR.
            - {arch: aarch64, toolchain: clang}
            - {arch: aarch64, toolchain: mingw}
        macos:
          include:
            - {runner: macos-15-intel, arch: x86_64, host_arch: x86_64}
            - {runner: macos-26-intel, arch: x86_64, host_arch: x86_64}
            - {runner: macos-15, arch: aarch64, host_arch: arm64}
            - {runner: macos-26, arch: aarch64, host_arch: arm64}
        windows:
          arch: [x86_64]
          toolchain: [msvc, clang-cl, msys2-mingw, msys2-clang]
          runner: [windows-2022]

      benchmark:
        include:
          - system: ubuntu-22.04
            architecture: x86_64
            toolchain: gcc
            runner: ubuntu-latest
          - system: macos-26
            architecture: x86_64
            toolchain: apple-clang
            runner: macos-26-intel
            host_architecture: x86_64
          - system: macos-26
            architecture: aarch64
            toolchain: apple-clang
            runner: macos-26
            host_architecture: arm64

    musl:
      build:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            target: linux-x86_64-musl
            service: build-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: linux-aarch64-musl
            service: build-musl-aarch64
            # Use a versioned native ARM runner; ubuntu-latest-arm is unavailable.
            runner: ubuntu-24.04-arm

      test:
        linux:
          distro: [alpine, ubuntu-18.04, ubuntu-20.04, ubuntu-22.04]
          arch: [x86_64, aarch64]
          toolchain: [gcc, clang, mingw]
          include:
            - {arch: x86_64, runner: ubuntu-latest}
            # Use a versioned native ARM runner; ubuntu-latest-arm is unavailable.
            - {arch: aarch64, runner: ubuntu-24.04-arm}
          exclude:
            # These older Ubuntu ARM image tags are not published in GHCR.
            - {arch: aarch64, distro: ubuntu-18.04}
            - {arch: aarch64, distro: ubuntu-20.04}
            # ARM Clang and MinGW image tags are not published in GHCR.
            - {arch: aarch64, toolchain: clang}
            - {arch: aarch64, toolchain: mingw}

      benchmark:
        include:
          - system: ubuntu-22.04
            architecture: x86_64
            toolchain: gcc
            runner: ubuntu-latest

    ucrt:
      build:
        # The current MinGW cross-toolchain cannot build a Windows AArch64 package.
        arch: [x86_64]
        include:
          - arch: x86_64
            target: windows-x86_64-ucrt
            service: build-ucrt
            runner: ubuntu-latest

      test:
        windows:
          arch: [x86_64]
          toolchain: [msvc, clang-cl, msys2-mingw, msys2-clang]
          runner: [windows-2022]

jobs:
  validate-ci-matrix:
    name: Validate and prepare CI matrix / ${{ needs.changes.outputs.full_suite == 'true' && 'full' || 'smoke' }}
    needs: changes
    runs-on: ubuntu-latest
    permissions: {}
    env:
      OMNI_TEST_SUITE: ${{ needs.changes.outputs.full_suite == 'true' && 'full' || 'smoke' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      suite: ${{ env.OMNI_TEST_SUITE }}
    steps:
      - name: Validate YAML and prepare matrices
        id: matrix
        run: |
          python3 -m pip install --quiet PyYAML==6.0.2
          python3 - <<'PY'
          import json
          import os
          import yaml

          matrix = yaml.safe_load(os.environ['CI_MATRIX'])
          if not isinstance(matrix, dict) or not matrix:
              raise SystemExit('CI_MATRIX must be a nonempty YAML mapping')
          for runtime, coverage in matrix.items():
              build = coverage['build']
              coverage['build'] = {**build, 'runtime': [runtime]}
              packages = {row['arch']: row['target'] for row in build['include']}
              # A universal package serves every tested architecture.
              package_targets = [
                  {'package_target': target} if arch == 'universal' else {
                      'arch': arch, 'package_target': target,
                  }
                  for arch, target in packages.items()
              ]
              for platform, tests in coverage.get('test', {}).items():
                  # Include-only matrices need the runtime on each row;
                  # adding an axis would merge their independent rows.
                  coverage['test'][platform] = {
                      **tests,
                      'runtime': [runtime],
                      'include': tests.get('include', []) + package_targets,
                  } if tests.keys() - {'include', 'exclude'} else {
                      **tests,
                      'include': [
                          {**row, 'runtime': runtime,
                           'package_target': packages.get(
                               row['arch'], packages.get('universal'))}
                          for row in tests.get('include', [])
                      ],
                  }
              if 'benchmark' in coverage:
                  coverage['benchmark'] = {'include': [
                      {**row, 'libc': runtime,
                       'package_target': packages.get(
                           row['architecture'], packages.get('universal'))}
                      for row in coverage['benchmark']['include']
                  ]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(matrix), file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('## Prepared CI matrix\n', file=summary)
              print('Test suite: **' + os.environ['OMNI_TEST_SUITE'] + '**\n', file=summary)
              print('| Distribution | Packages | Test platforms |', file=summary)
              print('| --- | --- | --- |', file=summary)
              for runtime, coverage in matrix.items():
                  packages = ', '.join(row['target'] for row in coverage['build']['include'])
                  platforms = []
                  for platform, tests in coverage.get('test', {}).items():
                      architectures = tests.get('arch') or sorted({
                          row['arch'] for row in tests.get('include', []) if 'arch' in row
                      })
                      platforms.extend(platform + '-' + arch for arch in architectures)
                  print(f'| {runtime} | {packages} | ' + ', '.join(platforms) + ' |', file=summary)
              for runtime, coverage in matrix.items():
                  prepared = json.dumps(coverage, indent=2)
                  print(f'::group::Prepared {runtime} matrix')
                  print(prepared)
                  print('::endgroup::')
                  print(f'\n<details><summary>{runtime}: platforms, architectures, '
                        'compilers, runners, exclusions, and benchmarks</summary>\n',
                        file=summary)
                  print('```json\n' + prepared + '\n```\n\n</details>', file=summary)
          PY

  # Site-only changes normally deploy Pages without rebuilding packages.
  # Full-suite selection or `build_sources` forces package work.
  changes:
    name: Select CI work and test suite
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      build_sources: ${{ steps.sources.outputs.build_sources }}
      full_suite: ${{ steps.suite.outputs.full_suite }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select test suite
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_FULL: ${{ inputs.full_suite }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ true = "$REQUESTED_FULL" ]; then
            echo 'full_suite=true' >> "$GITHUB_OUTPUT"
            echo 'Full suite explicitly requested.'
          elif [ pull_request = "$GITHUB_EVENT_NAME" ]; then
            selection=$(python3 ci/full_validation.py --pull-request "$PR_NUMBER")
            printf '%s\n' "$selection"
            printf '%s\n\n' "$selection" >> "$GITHUB_STEP_SUMMARY"
          elif [ push = "$GITHUB_EVENT_NAME" ] && [ refs/heads/master = "$GITHUB_REF" ]; then
            selection=$(python3 ci/full_validation.py)
            printf '%s\n' "$selection"
            printf '%s\n\n' "$selection" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'full_suite=false' >> "$GITHUB_OUTPUT"
            echo 'Smoke suite selected; automatic commit cadence applies only to master pushes.'
          fi

      - name: "Test suite: ${{ steps.suite.outputs.full_suite == 'true' && 'full' || 'smoke' }}"
        env:
          OMNI_TEST_SUITE: ${{ steps.suite.outputs.full_suite == 'true' && 'full' || 'smoke' }}
        run: |
          echo "::notice::Selected test suite: $OMNI_TEST_SUITE"
          printf '## Selected test suite: %s\n' "$OMNI_TEST_SUITE" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect source changes
        id: sources
        env:
          FORCE_BUILD: ${{ inputs.build_sources || steps.suite.outputs.full_suite == 'true' }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ true = "${FORCE_BUILD:-false}" ]; then
            echo 'build_sources=true' >> "$GITHUB_OUTPUT"
            exit
          fi

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              before=$PR_BASE_SHA
              after=$PR_HEAD_SHA
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                echo 'build_sources=true' >> "$GITHUB_OUTPUT"
                exit
              fi
              before=$BEFORE_SHA
              after=$GITHUB_SHA
              ;;
            *)
              if ! before=$(git rev-parse "$GITHUB_SHA^"); then
                echo 'build_sources=true' >> "$GITHUB_OUTPUT"
                exit
              fi
              after=$GITHUB_SHA
              ;;
          esac

          build_sources=false
          while IFS= read -r file; do
            # Site inputs and Conan recipes do not change the release packages.
            case "$file" in
              README.md | omnirefl-banner.png | site/* | conan/*) ;;
              *)
                build_sources=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames "$before" "$after")

          echo "build_sources=$build_sources" >> "$GITHUB_OUTPUT"

      - name: "Package checks selected: ${{ steps.sources.outputs.build_sources }}"
        env:
          BUILD_SOURCES: ${{ steps.sources.outputs.build_sources }}
          OMNI_TEST_SUITE: ${{ steps.suite.outputs.full_suite == 'true' && 'full' || 'smoke' }}
        run: |
          if [ true = "$BUILD_SOURCES" ]; then
            decision="Package tests ($OMNI_TEST_SUITE) and benchmarks selected."
            if [ full = "$OMNI_TEST_SUITE" ]; then
              scope='All tests across the supported platform, compiler, and C++ standard matrix.'
            else
              scope='Guides and base-interface tests across the supported platform, compiler, and C++ standard matrix.'
            fi
          else
            decision='No package changes detected; package tests and benchmarks skipped.'
            scope=''
          fi
          echo "::notice::$decision"
          printf '\n%s\n%s\n' "$decision" "$scope" >> "$GITHUB_STEP_SUMMARY"

  reusable-packages:
    name: Find exact-commit CI packages
    needs:
      - changes
      - validate-ci-matrix
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check package reuse policy
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'
      - name: Find successful package source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.validate-ci-matrix.outputs.matrix }}
        run: |
          mapfile -t targets < <(python3 - <<'PYTHON'
          import json
          import os
          print('extras')
          for runtime in json.loads(os.environ['MATRIX']).values():
              for row in runtime['build']['include']:
                  print(row['target'])
          PYTHON
          )
          python3 ci/reuse_ci.py find --require-symbols --targets "${targets[@]}"

      - name: Report package reuse
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          if [ -n "$SOURCE_RUN" ]; then
            decision="Reusing exact-commit packages and symbols from run $SOURCE_RUN."
          else
            decision='No reusable exact-commit packages and symbols found; building packages.'
          fi
          echo "::notice::$decision"
          printf '## Package reuse\n\n%s\n' "$decision" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SOURCE_RUN" ]; then
            printf '\n[Source run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-package-extras:
    name: Package extras
    runs-on: ubuntu-latest
    needs:
      - changes
      - reusable-packages
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Restore Extras Archive
        if: ${{ '' != needs.reusable-packages.outputs.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.reusable-packages.outputs.run_id }}
        run: >-
          python3 ci/reuse_ci.py download --run-id "$SOURCE_RUN"
          --target extras --packages-dir artifacts/packages/extras
      - name: Package Extras
        if: ${{ '' == needs.reusable-packages.outputs.run_id }}
        run: >-
          cmake -DOMNIREFL_PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }}
          -P extras/package.cmake
      - name: Upload Extras Archive
        uses: actions/upload-artifact@v6
        with:
          name: packages-extras-${{ steps.commit.outputs.short_sha }}
          path: artifacts/packages/extras/*.tar.gz
          if-no-files-found: error
          overwrite: true

  build-package-cosmo:
    name: Build package / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - changes
      - validate-ci-matrix
      - reusable-packages
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).cosmo.build }}

    # Shared by the active distro build jobs; keep packaging steps in one place.
    steps: &build_package_steps
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Restore Package and Debug Symbols
        if: ${{ '' != needs.reusable-packages.outputs.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.reusable-packages.outputs.run_id }}
        run: >-
          python3 ci/reuse_ci.py download --run-id "$SOURCE_RUN"
          --target ${{ matrix.target }}
          --packages-dir ./artifacts/packages/${{ matrix.runtime }}
          --symbols-dir "$RUNNER_TEMP/symbols"

      - name: Pull Build Image
        if: ${{ '' == needs.reusable-packages.outputs.run_id }}
        # Compose owns the toolchain versions and resolves the complete image
        # tag for the selected build service.
        run: docker compose pull ${{ matrix.service }}

      - name: Build and Package Omnirefl
        if: ${{ '' == needs.reusable-packages.outputs.run_id }}
        run: |
          PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }} \
          PACKAGE_DIR=./artifacts/packages/${{ matrix.runtime }} \
            docker compose run --rm ${{ matrix.service }}

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.target }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/${{ matrix.runtime }}
          if-no-files-found: error
          # A later symbol-staging failure may leave this artifact in the same
          # run. Permit the failed package job to be retried.
          overwrite: true

      - name: Stage Debug Symbols
        # Keep symbols with smoke packages so full validation and release can
        # reuse the same builds, including manually dispatched branch runs.
        if: ${{ '' == needs.reusable-packages.outputs.run_id }}
        run: |
          shopt -s nullglob
          symbol_dirs=(./build-alpine/${{ matrix.runtime }}/${{ matrix.arch }}/*/symbols)
          symbol_names=(omnirefl.debug ccdb_query.debug)
          if [ cosmo = "${{ matrix.runtime }}" ]; then
            symbol_dirs=(./build-alpine/cosmo/*/x86_64/symbols)
            symbol_names=(
              x86_64/omnirefl.debug x86_64/ccdb_query.debug
              aarch64/omnirefl.debug aarch64/ccdb_query.debug
            )
          elif [ ucrt = "${{ matrix.runtime }}" ]; then
            symbol_names=(omnirefl.exe.debug ccdb_query.exe.debug)
          fi
          test 1 -eq "${#symbol_dirs[@]}"
          for symbol in "${symbol_names[@]}"; do
            test -s "${symbol_dirs[0]}/$symbol"
          done
          # Package containers may leave the mounted artifact directory owned
          # by root. Stage host-side release data in the runner-owned temp dir.
          mkdir -p "$RUNNER_TEMP/symbols"
          cp -r "${symbol_dirs[0]}/." "$RUNNER_TEMP/symbols/"

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v6
        with:
          name: symbols-${{ matrix.target }}-${{ steps.commit.outputs.short_sha }}
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error
          overwrite: true

  build-package-musl:
    name: Build package / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - changes
      - validate-ci-matrix
      - reusable-packages
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).musl.build }}

    steps: *build_package_steps

  build-package-ucrt:
    name: Build package / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - changes
      - validate-ci-matrix
      - reusable-packages
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).ucrt.build }}

    steps: *build_package_steps

  # TODO: [low] Add package integration tests for Conan and CMake FetchContent with
  # an OS × type CI matrix. Locally, warn and skip when required tools are
  # unavailable. Add vcpkg coverage when its adapter is available.

  # Package tests use the same matrix vocabulary as docker-compose.yml:
  #
  #   platform=<alpine|ubuntu-18.04|ubuntu-20.04|ubuntu-22.04|windows|macos>
  #   toolchain=<gcc|clang|mingw|msvc|clang-cl|msys2-mingw|msys2-clang>
  #
  # Linux rows dispatch to Compose services. Windows and macOS rows install
  # directly on GitHub-hosted runners; local Windows validation uses the
  # separate Compose services because its Windows container environment cannot
  # be reproduced by GitHub-hosted runners. Platform runners infer package
  # runtime and archive handling from filenames.
  test-package-linux-cosmo:
    name: Package test / linux-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.runtime }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    env: &test_suite_env
      OMNI_TEST_SUITE: ${{ needs.validate-ci-matrix.outputs.suite }}
    needs:
      - build-package-cosmo
      - validate-ci-matrix
      - build-package-extras
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).cosmo.test.linux }}

    # Both distro jobs use the same package test procedure.
    steps: &test_package_linux_steps
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Download Packages
        # Ad hoc: download-artifact currently fails for some artifacts uploaded
        # by Ubuntu runners. The REST download remains valid.
        # https://github.com/actions/upload-artifact/issues/811
        # REFACTORME: Restore download-artifact after the upstream fix ships.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/github_artifacts.py --run-id "$GITHUB_RUN_ID" \
            --name "packages-${{ matrix.package_target }}-${{ steps.commit.outputs.short_sha }}" \
            --destination ./artifacts/packages/current
          python3 ci/github_artifacts.py --run-id "$GITHUB_RUN_ID" \
            --name "packages-extras-${{ steps.commit.outputs.short_sha }}" \
            --destination ./artifacts/packages/extras

      - name: Prepare Docker Image
        run: |
          platform=${{ matrix.distro }}
          service=test-${platform%%-*}
          if [[ "$platform" == ubuntu-* ]]; then
            export UBUNTU_VERSION=${platform#ubuntu-}
            echo "UBUNTU_VERSION=$UBUNTU_VERSION" >> "$GITHUB_ENV"
          fi
          if [ "aarch64" = "${{ matrix.arch }}" ]; then
            service=$service-aarch64
          fi
          TOOLCHAIN=${{ matrix.toolchain }} docker compose pull "$service"
          echo "TEST_SERVICE=$service" >> "$GITHUB_ENV"

      - name: Verify Test Container Architecture
        run: |
          test "$(
            TOOLCHAIN=${{ matrix.toolchain }} \
              docker compose run --rm --entrypoint uname "$TEST_SERVICE" -m
          )" = "${{ matrix.arch }}"

      - name: Run Package Test
        run: |
          TOOLCHAIN=${{ matrix.toolchain }} \
          PACKAGE_DIR=./artifacts/packages/current \
          TEST_NAME=linux-${{ matrix.distro }}-${{ matrix.arch }}-${{
            matrix.runtime }}-${{ matrix.toolchain }} \
          TEST_RESULTS_DIR=./artifacts/test-results/linux-${{
            matrix.distro }}-${{ matrix.arch }}-${{
            matrix.runtime }}-${{ matrix.toolchain }} \
            docker compose run --rm "$TEST_SERVICE"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-linux-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.runtime }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/linux-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.runtime }}-${{ matrix.toolchain }}
          if-no-files-found: error

  test-package-linux-musl:
    name: Package test / linux-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.runtime }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    env: *test_suite_env
    needs:
      - build-package-musl
      - validate-ci-matrix
      - build-package-extras
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).musl.test.linux }}

    steps: *test_package_linux_steps

  test-package-macos:
    name: Package test / ${{ matrix.runner }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env: *test_suite_env
    needs:
      - build-package-cosmo
      - validate-ci-matrix
      - build-package-extras
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).cosmo.test.macos }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Download Extras
        uses: actions/download-artifact@v8
        with:
          name: packages-extras-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/extras

      - name: Download Cosmo Package
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.package_target }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/cosmo

      - name: Report Runner Characteristics
        continue-on-error: true
        run: |
          sw_vers
          uname -m
          sysctl hw.model machdep.cpu.brand_string \
            hw.physicalcpu hw.logicalcpu hw.memsize
          uptime
          vm_stat
          sysctl vm.swapusage
          # Hosted VMs may not expose thermal status.
          pmset -g therm

      - name: Run Package Tests
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/test-results/${{ matrix.runner }}-${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.host_arch }}"
          packages=(artifacts/packages/cosmo/*.tar.gz)
          test 1 -eq "${#packages[@]}"
          ci/test_package.sh \
            --package "${packages[0]}" \
            --extras artifacts/packages/extras/omnirefl-extras-*.tar.gz \
            --name "${{ matrix.runner }}-${{ matrix.arch }}" \
            --results "$results"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-${{ matrix.runner }}-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/${{ matrix.runner }}-${{ matrix.arch }}
          if-no-files-found: error

  test-package-windows-cosmo:
    name: Package test / windows-${{ matrix.runtime }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    env: *test_suite_env
    needs:
      - changes
      - build-package-cosmo
      - validate-ci-matrix
      - build-package-extras
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).cosmo.test.windows }}

    # Both runtimes use the same Windows package test procedure.
    steps: &test_package_windows_steps
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: '"short_sha=$($env:GITHUB_SHA.Substring(0, 12))" >> $env:GITHUB_OUTPUT'

      - name: Download Extras
        uses: actions/download-artifact@v8
        with:
          name: packages-extras-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/extras

      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.package_target }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/current

      - name: Run MSVC-compatible Package Tests
        if: ${{ 'msvc' == matrix.toolchain || 'clang-cl' == matrix.toolchain }}
        # Windows PowerShell promotes ordinary native stderr (for example,
        # Git's clone progress) to NativeCommandError under the runner's strict
        # error preference. PowerShell 7 preserves it as process output; the
        # package runner checks native exit codes explicitly.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw 'Visual Studio with the x64 C++ toolchain was not found'
          }

          $vsDevCmd = "$vsInstall/Common7/Tools/VsDevCmd.bat"
          $vsEnv = & $env:ComSpec /d /c "`"$vsDevCmd`" -arch=x64 >nul && set"
          if (0 -ne $LASTEXITCODE) {
            throw 'failed to initialize the Visual Studio environment'
          }

          foreach ($line in $vsEnv) {
            if ($line -match '^(.*?)=(.*)$') {
              Set-Item -Path ('Env:' + $Matches[1]) -Value $Matches[2]
            }
          }

          if ('clang-cl' -eq '${{ matrix.toolchain }}') {
            $llvmBin = 'C:/Program Files/LLVM/bin'
            if (!(Test-Path "$llvmBin/clang-cl.exe")) {
              throw 'clang-cl was not found in the hosted runner LLVM installation'
            }

            $env:Path = "$llvmBin;$env:Path"
            $env:CC = 'clang-cl'
            $env:CXX = 'clang-cl'
          }

          $archives = @(ls 'artifacts/packages/current' -r -File)
          if (1 -ne $archives.Count) { throw 'expected one package archive' }
          $extras = @(ls 'artifacts/packages/extras/omnirefl-extras-*.tar.gz' -File)
          if (1 -ne $extras.Count) { throw 'expected one extras archive' }
          ./ci/test_package.ps1 -Package $archives[0].FullName `
            -Extras $extras[0].FullName `
            -Name 'windows-${{ matrix.runtime }}-${{ matrix.toolchain }}' `
            -Results 'artifacts/test-results/windows-${{ matrix.runtime }}-${{ matrix.toolchain }}'

      - name: Install MSYS2 Toolchain
        if: ${{ startsWith(matrix.toolchain, 'msys2-') }}
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: >-
            ${{ 'msys2-clang' == matrix.toolchain
              && 'CLANG64' || 'MINGW64' }}
          release: false
          update: true
          install: git
          # :p selects packages for the chosen MSYS2 environment.
          pacboy: >-
            cmake:p ninja:p
            ${{ 'msys2-clang' == matrix.toolchain && 'clang:p' || 'gcc:p' }}

      - name: Run MSYS2 Package Tests
        if: ${{ startsWith(matrix.toolchain, 'msys2-') }}
        shell: msys2 {0}
        env:
          CC: ${{ 'msys2-clang' == matrix.toolchain && 'clang' || 'gcc' }}
          CXX: ${{ 'msys2-clang' == matrix.toolchain && 'clang++' || 'g++' }}
        run: |
          set -euo pipefail
          packages=(artifacts/packages/current/*)
          test 1 -eq "${#packages[@]}"
          ci/test_package.sh \
            --package "${packages[0]}" \
            --extras artifacts/packages/extras/omnirefl-extras-*.tar.gz \
            --name windows-${{ matrix.runtime }}-${{ matrix.toolchain }} \
            --results "$PWD/artifacts/test-results/windows-${{ matrix.runtime }}-${{ matrix.toolchain }}"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-windows-${{ matrix.runtime }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/windows-${{ matrix.runtime }}-${{ matrix.toolchain }}
          if-no-files-found: error

  test-package-windows-ucrt:
    name: Package test / windows-${{ matrix.runtime }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    env: *test_suite_env
    needs:
      - changes
      - build-package-ucrt
      - validate-ci-matrix
      - build-package-extras
    if: ${{ 'true' == needs.changes.outputs.build_sources }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).ucrt.test.windows }}

    steps: *test_package_windows_steps

  # Benchmarks run independently on every CI event so pull requests can report
  # regressions. Pages only persists successful master records afterward.
  # TODO: Add Windows benchmark coverage for Cosmo and UCRT after validating
  # the benchmark runner on Windows.
  benchmark-cosmo:
    name: Benchmark / ${{ matrix.system }}-${{ matrix.architecture }}-${{ matrix.libc }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-package-cosmo
      - validate-ci-matrix
      - build-package-extras
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).cosmo.benchmark }}
    # Shared names and paths are evaluated for each benchmark matrix row.
    env: &benchmark_env
      BENCHMARK_NAME: >-
        ${{ matrix.system }}-${{ matrix.architecture }}-${{
          matrix.libc }}-${{ matrix.toolchain }}
      BENCHMARK_BUILD: >-
        ./artifacts/benchmark-build/${{
          matrix.system }}-${{ matrix.architecture }}-${{
          matrix.libc }}-${{ matrix.toolchain }}
      BENCHMARK_RESULTS: >-
        ./artifacts/benchmarks/${{
          matrix.system }}-${{ matrix.architecture }}-${{
          matrix.libc }}-${{ matrix.toolchain }}
      BENCHMARK_HISTORY: ./artifacts/benchmark-history/history.json
      BENCHMARK_HISTORY_URL: >-
        https://${{ github.repository_owner }}.github.io/${{
          github.event.repository.name }}/benchmarks/history.json

    # Both distro jobs use the same measurement and reporting steps.
    steps: &benchmark_steps
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      # Docker bind mounts must not create shared parents as root before the
      # runner writes benchmark records into them.
      - name: Prepare Benchmark Directories
        run: |
          mkdir -p "$BENCHMARK_BUILD"
          mkdir -p "$BENCHMARK_RESULTS"
          mkdir -p "$(dirname "$BENCHMARK_HISTORY")"
          mkdir -p ./artifacts/packages/${{ matrix.libc }}

      - name: Download Extras
        uses: actions/download-artifact@v8
        with:
          name: packages-extras-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/extras

      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.package_target }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/${{ matrix.libc }}

      - name: Install Cosmo Package on macOS
        if: ${{ startsWith(matrix.system, 'macos-') }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/with space"
          install="$root/omnirefl"
          mkdir -p "$root"
          test "$(uname -m)" = "${{ matrix.host_architecture }}"

          package="$(find artifacts/packages/cosmo \
            -maxdepth 1 -type f \
            -name 'omnirefl-${{ matrix.package_target }}-*.tar.gz' \
            -print -quit)"
          test -n "$package"
          tar -xzf "$package" -C "$root"

          package_root="$(find "$root" -mindepth 1 -maxdepth 1 \
            -type d -name 'omnirefl-*' -print -quit)"
          test -n "$package_root"
          mv "$package_root" "$install"
          echo "OMNIREFL_INSTALL_ROOT=$install" >> "$GITHUB_ENV"

      - name: Run Ubuntu Benchmark
        if: ${{ startsWith(matrix.system, 'ubuntu-') }}
        run: |
          system=${{ matrix.system }}
          UBUNTU_VERSION=${system#ubuntu-} \
          TOOLCHAIN=${{ matrix.toolchain }} \
          PACKAGE_DIR=./artifacts/packages/${{ matrix.libc }} \
          TEST_RESULTS_DIR="$BENCHMARK_RESULTS" \
          BUILD_DIR="$BENCHMARK_BUILD" \
            docker compose run --rm benchmark

      - name: Run macOS Benchmark
        if: ${{ startsWith(matrix.system, 'macos-') }}
        run: |
          ci/benchmark_package.sh \
            --install "$OMNIREFL_INSTALL_ROOT" \
            --extras artifacts/packages/extras/omnirefl-extras-*.tar.gz \
            --build "$BENCHMARK_BUILD" \
            --results "$BENCHMARK_RESULTS" \
            --name "$BENCHMARK_NAME"

      - name: Download Published Benchmark History
        run: |
          if ! status="$(curl --location --silent --show-error \
            --header 'Cache-Control: no-cache' \
            --output "$BENCHMARK_HISTORY" \
            --write-out '%{http_code}' \
            "$BENCHMARK_HISTORY_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"; then
            echo 'published benchmark history is unavailable' >&2
            exit 1
          fi

          if [ 404 = "$status" ]; then
            rm -f "$BENCHMARK_HISTORY"
            echo '::notice title=Benchmark baseline::published history does not exist'
          elif [ 200 != "$status" ]; then
            echo "published benchmark history returned HTTP $status" >&2
            exit 1
          fi

      - name: Check Benchmark Regression
        run: |
          python3 -B ci/benchmark_history.py compare \
            --current "$BENCHMARK_RESULTS/benchmark.json" \
            --history "$BENCHMARK_HISTORY" \
            --system ${{ matrix.system }} \
            --architecture ${{ matrix.architecture }} \
            --libc ${{ matrix.libc }} \
            --toolchain ${{ matrix.toolchain }} \
            --threshold 1.2 \
            --min-delta-ms 500 \
            --count 5

      - name: Create Benchmark Record
        env:
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
        run: |
          python3 -B ci/benchmark_history.py record \
            --current "$BENCHMARK_RESULTS/benchmark.json" \
            --output "$BENCHMARK_RESULTS/run.json" \
            --commit "${{ github.sha }}" \
            --commit-title "$COMMIT_TITLE" \
            --system ${{ matrix.system }} \
            --architecture ${{ matrix.architecture }} \
            --libc ${{ matrix.libc }} \
            --toolchain ${{ matrix.toolchain }}

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            benchmark-${{ matrix.system }}-${{ matrix.architecture }}-${{ matrix.libc }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ${{ env.BENCHMARK_RESULTS }}
          if-no-files-found: error

  benchmark-musl:
    name: Benchmark / ${{ matrix.system }}-${{ matrix.architecture }}-${{ matrix.libc }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-package-musl
      - validate-ci-matrix
      - build-package-extras
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs['validate-ci-matrix'].outputs.matrix).musl.benchmark }}
    env: *benchmark_env

    steps: *benchmark_steps

  check-site:
    name: Check site
    runs-on: ubuntu-latest
    if: ${{ 'pull_request' == github.event_name }}
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check Site Build
        working-directory: site
        run: |
          npm ci
          npm run build

  required-ci:
    name: Required CI
    # TODO: [low] Revisit cancelled runs appearing as failed when GitHub fixes
    # https://github.com/actions/runner/issues/4047. Prefer a cancelled badge
    # only if no job had failed before cancellation was requested.
    runs-on: ubuntu-latest
    # GitHub constructs the job graph before matrix outputs exist;
    # needs must list these jobs explicitly.
    needs:
      - changes
      - reusable-packages
      - validate-ci-matrix
      - build-package-cosmo
      - build-package-musl
      - build-package-ucrt
      - check-site
      - test-package-linux-cosmo
      - test-package-linux-musl
      - test-package-macos
      - test-package-windows-cosmo
      - test-package-windows-ucrt
      - build-package-extras
    permissions:
      contents: read
      actions: write
    if: always()

    steps:
      - name: Find previous aggregate artifact
        id: previous_aggregate
        if: ${{ 'true' == needs.changes.outputs.build_sources }}
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })

            const artifact = artifacts
              .filter(({name}) =>
                name.startsWith('aggregated-test-results-attempt-'))
              .sort((lhs, rhs) =>
                new Date(rhs.created_at) - new Date(lhs.created_at))[0]

            core.setOutput('name', artifact?.name ?? '')

      - name: Download previous aggregate artifact
        id: download_previous
        if: >-
          ${{ 'true' == needs.changes.outputs.build_sources
            && '' != steps.previous_aggregate.outputs.name }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.previous_aggregate.outputs.name }}
          path: ./test-results

      - name: Download test artifacts
        id: download_tests
        if: ${{ 'true' == needs.changes.outputs.build_sources }}
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ./test-results

      - name: Upload aggregated test artifact
        id: upload_agg
        if: >-
          ${{ always()
            && 'true' == needs.changes.outputs.build_sources
            && 'success' == steps.download_tests.outcome
            && ('' == steps.previous_aggregate.outputs.name
              || 'success' == steps.download_previous.outcome) }}
        uses: actions/upload-artifact@v6
        with:
          name: aggregated-test-results-attempt-${{ github.run_attempt }}
          path: ./test-results
          if-no-files-found: error

      - name: Clean up intermediate artifacts
        # Results are already aggregated; cleanup outages must not fail validation.
        continue-on-error: true
        if: >-
          ${{ always()
            && 'true' == needs.changes.outputs.build_sources
            && 'success' == steps.upload_agg.outcome
            && ('pull_request' != github.event_name
              || github.event.pull_request.head.repo.full_name
                == github.repository) }}
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })

            for (const artifact of artifacts.filter(({name}) =>
              name.startsWith('test-'))) {
              core.info(`deleting intermediate artifact: ${artifact.name}`)
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              })
            }

      - name: Require successful package and test jobs
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ['JOB_RESULTS'])
          build_sources = 'true' == jobs['changes']['outputs'].get('build_sources')
          failed = [
              name for name, job in jobs.items()
              if 'success' != job['result'] and (
                  name in ('changes', 'validate-ci-matrix')
                  or (build_sources and name == 'reusable-packages')
                  or ('check-site' == name
                      and 'pull_request' == os.environ['GITHUB_EVENT_NAME'])
                  or (build_sources and name.startswith(('build-package-', 'test-package-')))
              )
          ]
          for name, job in jobs.items():
              print(f'{name}: {job["result"]}')
          if failed:
              raise SystemExit('Required jobs failed: ' + ', '.join(failed))
          PY

      - name: Record the tested commit
        if: ${{ 'true' == needs.changes.outputs.build_sources }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          Path('validated-commit.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }))
          PYTHON

      - name: Upload tested-commit proof
        if: ${{ 'true' == needs.changes.outputs.build_sources }}
        uses: actions/upload-artifact@v6
        with:
          name: validated-commit-${{ github.sha }}
          path: validated-commit.json
          if-no-files-found: error
          overwrite: true

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    needs:
      - changes
      - required-ci
      - benchmark-cosmo
      - benchmark-musl
    if: >-
      ${{ always() && needs.changes.outputs.full_suite == 'true'
        && 'true' == needs.changes.outputs.build_sources }}
    permissions: {}
    steps:
      - name: Require complete validation
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          failed = [name for name, job in json.loads(os.environ['JOB_RESULTS']).items()
                    if job['result'] != 'success']
          if failed:
              raise SystemExit('Full validation failed: ' + ', '.join(failed))
          PYTHON

      - name: Record successful full-suite validation
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          Path('full-suite.json').write_text(json.dumps({
              'suite': 'full', 'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }))
          PYTHON

      - name: Upload full-suite proof
        uses: actions/upload-artifact@v6
        with:
          name: full-suite-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: full-suite.json
          if-no-files-found: error
          overwrite: true

  prepare-pages:
    name: Prepare Pages
    runs-on: ubuntu-latest
    needs:
      - changes
      - required-ci
      - benchmark-cosmo
      - benchmark-musl
    if: >-
      ${{ always()
        && 'success' == needs['required-ci'].result
        && ('false' == needs.changes.outputs.build_sources
          || ('success' == needs['benchmark-cosmo'].result
            && 'success' == needs['benchmark-musl'].result))
        && !inputs.skip_pages
        && 'refs/heads/master' == github.ref
        && ('push' == github.event_name
          || 'workflow_dispatch' == github.event_name) }}
    permissions:
      actions: read
      contents: read
      pages: write
    outputs:
      deploy: ${{ steps.pages_order.outputs.deploy }}
      artifact_name: ${{ steps.pages_artifact.outputs.name }}

    steps:
      # Actions concurrency groups retain only one pending job. Wait for the
      # preceding publication explicitly so none are discarded.
      - name: Order GitHub Pages Deployment
        id: pages_order
        uses: actions/github-script@v8
        timeout-minutes: 60
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const listRuns = () => github.paginate(
              github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id: 'ci.yml', branch: 'master', per_page: 100})
            const listJobs = (run_id) => github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {owner, repo, run_id, per_page: 100})
            const publications = (await listRuns()).filter(
              ({event}) => ['push', 'workflow_dispatch'].includes(event))
            const previous = publications
              .filter(({run_number}) => run_number < context.runNumber)
              .sort((left, right) => right.run_number - left.run_number)[0]

            if (previous && 'completed' !== previous.status) {
              core.notice(`waiting for preceding publication ${previous.id}`)

              while (true) {
                const run = await github.rest.actions.getWorkflowRun(
                  {owner, repo, run_id: previous.id})
                const deployment = (await listJobs(previous.id)).find(
                  ({name}) => 'Deploy Pages' === name)

                if ('completed' === run.data.status
                    || 'completed' === deployment?.status)
                  break

                await new Promise((resolve) => setTimeout(resolve, 30_000))
              }
            }

            for (const run of (await listRuns()).filter(
              ({event, run_number}) =>
                ['push', 'workflow_dispatch'].includes(event)
                && context.runNumber < run_number)) {
              const deployment = (await listJobs(run.id)).find(
                ({name}) => 'Deploy Pages' === name)
              const deployed = deployment
                && 'completed' === deployment.status
                && 'success' === deployment.steps.find(
                  ({name}) => 'Deploy GitHub Pages' === name)?.conclusion

              if (deployed) {
                core.notice(
                  `skipping Pages deployment superseded by run ${run.id}`)
                core.setOutput('deploy', 'false')
                return
              }
            }

            core.setOutput('deploy', 'true')

      - name: Configure GitHub Pages
        id: pages
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        uses: actions/configure-pages@v6

      - name: Checkout Repository
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Site Dependencies
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        working-directory: site
        run: npm ci

      - name: Build Site
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        working-directory: site
        run: npm run build

      - name: Download Benchmark Records
        id: benchmark_records
        if: >-
          ${{ 'true' == steps.pages_order.outputs.deploy
            && 'true' == needs.changes.outputs.build_sources }}
        # Ad hoc: download-artifact currently fails for some artifacts uploaded
        # by Ubuntu runners. The REST download remains valid.
        # https://github.com/actions/upload-artifact/issues/811
        # REFACTORME: Restore download-artifact after the upstream fix ships.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          from ci.github_artifacts import artifacts, extract, named_artifact

          available = artifacts(os.environ['GITHUB_RUN_ID'])
          names = [a['name'] for a in available if a['name'].startswith('benchmark-')]
          for name in names:
              extract(named_artifact(available, name), Path('artifacts/benchmarks') / name)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('available=' + str(bool(names)).lower(), file=output)
          if not names:
              print('::warning::No benchmark artifacts found; '
                    'preserving published benchmark history.')
          PYTHON

      # The deployed JSON is the durable history. Only a missing file starts a
      # new history; other download failures must not replace it with an empty
      # snapshot.
      - name: Download Published Benchmark History
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        env:
          BENCHMARK_HISTORY_URL: ${{ steps.pages.outputs.base_url }}/benchmarks/history.json
        run: |
          history=site/dist/benchmarks/history.json
          mkdir -p "$(dirname "$history")"
          if ! status="$(curl --location --silent --show-error \
            --header 'Cache-Control: no-cache' \
            --output "$history" \
            --write-out '%{http_code}' \
            "$BENCHMARK_HISTORY_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"; then
            echo 'failed to download the published benchmark history' >&2
            exit 1
          fi

          if [ 404 = "$status" ]; then
            rm -f "$history"
          elif [ 200 != "$status" ]; then
            echo "published benchmark history returned HTTP $status" >&2
            exit 1
          fi

      - name: Update Published Benchmark History
        if: >-
          ${{ 'true' == steps.pages_order.outputs.deploy
            && 'true' == needs.changes.outputs.build_sources
            && 'true' == steps.benchmark_records.outputs.available }}
        run: |
          mapfile -d '' records < <(
            find ./artifacts/benchmarks -type f -name run.json -print0)
          test 0 -lt "${#records[@]}"
          python3 -B ci/benchmark_history.py merge \
            --history site/dist/benchmarks/history.json \
            --run "${records[@]}" \
            --max-runs 200

      - name: Resolve GitHub Pages Artifact Name
        id: pages_artifact
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        run: >-
          echo "name=github-pages-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages Artifact
        if: ${{ 'true' == steps.pages_order.outputs.deploy }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: site/dist
          retention-days: 30

  # A job boundary avoids deployment racing its freshly finalized upload.
  # https://github.com/actions/deploy-pages/issues/451
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: prepare-pages
    # Deploy after successful preparation even when an optional ancestor was skipped.
    # https://github.com/actions/runner/issues/2205
    if: >-
      ${{ !cancelled()
        && 'success' == needs.prepare-pages.result
        && 'true' == needs.prepare-pages.outputs.deploy }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.prepare-pages.outputs.artifact_name }}
