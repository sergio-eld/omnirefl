name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    # todo: I am not sure this is a good way, but otherwise Remove Old Artifacts fails
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        include:
          - os: linux
            run_tests: true
          - os: windows
            run_tests: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull build-alpine Image
        run: docker pull sergioeld/omnirefl-build-alpine:latest

      - name: Build omnirefl tool
        run: |
          docker compose run --rm build-${{ matrix.os }}

      - name: Run test
        if: ${{ matrix.run_tests }}
        run: docker compose run --rm build-tests-alpine

      # todo: packaging should not run on a merge request (? I think)
      - name: Package omnirefl tool
        run: |
          docker compose run --rm package-${{ matrix.os }}
      
      # todo: test results and benchmarks (for continious bench)
      # todo: separate packages for windows and linux
      - name: Remove Old Artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '90 seconds' # '<number> <unit>', e.g. 5 days, 2 years, 90 seconds, parsed by Moment.js
          # Optional inputs
          skip-tags: true
          # ATTENTION: TODO: Ensure it doesn't remove artifacts from other jobs running in parallel
          skip-recent: 5

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.os }}
          path: ./build-alpine/*/install/
          if-no-files-found: error

  test-ubuntu:
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        version: [18, 20, 22]
        compiler: [gcc, clang]

    steps:
      # needed only for `docker-compose.yml`
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker Image
        run: docker pull sergioeld/test-install-ubuntu-${{ matrix.version }}-${{ matrix.compiler }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: install-linux
          path: ./build-alpine/

      - name: Run Test
        run: UBUNTU_VERSION=${{ matrix.version }} COMPILER=${{ matrix.compiler }} docker compose run --rm test-ubuntu

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # SAME name for all matrix entries – single artifact to aggregate later
          name: test-ubuntu-${{ matrix.version }}-${{ matrix.compiler }}
          # Directory where each container wrote:
          #   /build-alpine/test/ubuntu-<version>-<compiler>.xml / .log
          path: ./build-alpine/test
          if-no-files-found: error

  test-windows:
    runs-on: windows-2019
    needs: build-package
    strategy:
      fail-fast: false
      # matrix: #< todo

    steps:
      # needed only for `docker-compose.yml`
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker Image
        run: docker pull sergioeld/test-install-windows

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: install-windows
          path: ./build-alpine/

      # ensure bind mount sources exist for Docker on Windows
      - name: Prepare test directory
        run: |
          New-Item -ItemType Directory -Force -Path 'build-alpine\test' | Out-Null

      - name: Run Test
        run: docker compose run --rm test-windows

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # separate logical artifact name for windows
          name: test-windows
          # SAME on-disk path as linux -> aggregator sees everything under build-alpine/test
          path: ./build-alpine/test
          if-no-files-found: error

  # fixme: *.xml files are not generated by --output-junit
