name: CI
run-name: CI / ${{ 'pull_request' == github.event_name && github.event.pull_request.head.ref || github.ref_name }}

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  LLVM_VERSION: 22.1.8

jobs:
  # Package tests use the same matrix vocabulary as docker-compose.yml:
  #
  #   platform=<alpine|ubuntu-18.04|ubuntu-20.04|ubuntu-22.04|windows>
  #   toolchain=<gcc|clang|mingw|msvc|clang-cl|msys2-mingw|msys2-clang>
  #
  # Linux rows dispatch to Compose services. Windows rows install and test the
  # package directly on GitHub-hosted runners; the Compose services remain the
  # local package-test entrypoints.
  build-package:
    name: Build package / ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ 'aarch64' == matrix.arch && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        arch: [x86_64, aarch64]
        exclude:
          - os: windows
            arch: aarch64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Pull build-alpine Image
        run: |
          if [ "aarch64" = "${{ matrix.arch }}" ]; then
            docker pull ghcr.io/sergio-eld/omnirefl-build-alpine-aarch64-musl:llvm-${LLVM_VERSION}
          else
            docker pull ghcr.io/sergio-eld/omnirefl-build-alpine-x86_64-musl-ucrt:llvm-${LLVM_VERSION}
          fi

      - name: Build and package omnirefl tool
        run: |
          PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }} \
          PACKAGE_DIR=./artifacts/packages/${{ matrix.os }} \
            docker compose run --rm \
              build-${{ matrix.os }}${{ 'aarch64' == matrix.arch && '-aarch64' || '' }}

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}${{ 'linux' == matrix.os && '-musl' || '-ucrt' }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/${{ matrix.os }}
          if-no-files-found: error

  test-linux:
    name: Linux test / ${{ matrix.platform }}-${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        platform: [alpine, ubuntu-18.04, ubuntu-20.04, ubuntu-22.04]
        toolchain: [gcc, clang, mingw]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Pull Docker Image
        run: |
          if [ "alpine" = "${{ matrix.platform }}" ]; then
            docker pull \
              "ghcr.io/sergio-eld/omnirefl-test-alpine:3.23.3-x86_64-${{ matrix.toolchain }}"
          else
            ubuntu_version="${{ matrix.platform }}"
            docker pull \
              "ghcr.io/sergio-eld/omnirefl-test-ubuntu:${ubuntu_version#ubuntu-}-x86_64-${{ matrix.toolchain }}"
          fi

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-linux-x86_64-musl-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/linux

      - name: Run Package Test
        run: |
          if [ "alpine" = "${{ matrix.platform }}" ]; then
            TOOLCHAIN=${{ matrix.toolchain }} \
            LINUX_PACKAGE_DIR=./artifacts/packages/linux \
            TEST_RESULTS_DIR=./artifacts/test-results/${{ matrix.platform }}-${{ matrix.toolchain }} \
              docker compose run --rm test-alpine
          else
            ubuntu_version="${{ matrix.platform }}"
            UBUNTU_VERSION="${ubuntu_version#ubuntu-}" \
            TOOLCHAIN=${{ matrix.toolchain }} \
            LINUX_PACKAGE_DIR=./artifacts/packages/linux \
            TEST_RESULTS_DIR=./artifacts/test-results/${{ matrix.platform }}-${{ matrix.toolchain }} \
              docker compose run --rm test-ubuntu
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-${{ matrix.platform }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/${{ matrix.platform }}-${{ matrix.toolchain }}
          if-no-files-found: error

  benchmark:
    name: Benchmark / ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: build-package
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux]
        arch: [x86_64]
        libc: [musl]
        toolchain: [gcc]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-musl-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/${{ matrix.os }}

      - name: Run benchmark
        run: |
          UBUNTU_VERSION=22.04 \
          TOOLCHAIN=${{ matrix.toolchain }} \
          LINUX_PACKAGE_DIR=./artifacts/packages/${{ matrix.os }} \
          TEST_RESULTS_DIR=./artifacts/benchmarks \
          BUILD_DIR=./artifacts/benchmark-build/${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }} \
            docker compose run --rm benchmark

      - name: Find benchmark history artifact
        id: history_run
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const workflow_id = 'ci.yml'
            const branch = context.payload.repository.default_branch
            const historyArtifactPrefix =
              'benchmark-history-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}'

            const historyArtifactFrom = async (run_id) => {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id, per_page: 100})

              return artifacts
                .filter(({expired, name}) =>
                  !expired && (
                    historyArtifactPrefix === name ||
                    name.startsWith(`${historyArtifactPrefix}-attempt-`)))
                .sort((lhs, rhs) =>
                  new Date(rhs.created_at) - new Date(lhs.created_at))[0]
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id,
                branch,
                status: 'success',
                per_page: 20,
              })

            for (const run of runs) {
              if (context.runId === run.id) {
                continue
              }

              const artifact = await historyArtifactFrom(run.id)
              if (artifact) {
                core.setOutput('run_id', run.id)
                core.setOutput('artifact_name', artifact.name)
                return
              }
            }

            core.setOutput('run_id', '')

      - name: Download benchmark history
        if: ${{ '' != steps.history_run.outputs.run_id }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.history_run.outputs.artifact_name }}
          path: ./artifacts/benchmark-history
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.history_run.outputs.run_id }}

      - name: Prepare benchmark history
        run: mkdir -p ./artifacts/benchmark-history

      - name: Check benchmark regression
        run: |
          python3 -B ci/benchmark_history.py compare \
            --current ./artifacts/benchmarks/benchmark.json \
            --history ./artifacts/benchmark-history/history.json \
            --os ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }} \
            --arch ${{ matrix.arch }} \
            --libc ${{ matrix.libc }} \
            --threshold 1.2 \
            --min-delta-ms 500 \
            --count 5

      - name: Update benchmark history
        if: ${{ 'push' == github.event_name && 'master' == github.ref_name }}
        env:
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
        run: |
          python3 -B ci/benchmark_history.py update \
            --current ./artifacts/benchmarks/benchmark.json \
            --history ./artifacts/benchmark-history/history.json \
            --commit "${{ github.sha }}" \
            --commit-title "$COMMIT_TITLE" \
            --os ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }} \
            --arch ${{ matrix.arch }} \
            --libc ${{ matrix.libc }} \
            --max-runs 200

      # TODO: after release or once the repository is public, move benchmark
      # history away from artifact storage. GitHub artifacts are easy to delete,
      # so this is only a temporary private-repo storage workaround.
      - name: Upload benchmark history
        if: ${{ success() && 'push' == github.event_name && 'master' == github.ref_name }}
        uses: actions/upload-artifact@v6
        with:
          name: >-
            benchmark-history-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/benchmark-history
          if-no-files-found: error

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            benchmark-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/benchmarks
          if-no-files-found: error

  test-windows:
    name: Windows test / ${{ matrix.toolchain }}
    runs-on: windows-2022
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clang-cl, msys2-mingw, msys2-clang]
        include:
          - toolchain: msys2-mingw
            msystem: MINGW64
            cc: gcc
            cxx: g++
            packages: >-
              git
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-gcc
          - toolchain: msys2-clang
            msystem: CLANG64
            cc: clang
            cxx: clang++
            packages: >-
              git
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
              mingw-w64-clang-x86_64-clang

    steps:
      - name: Resolve Short SHA
        id: commit
        shell: powershell
        run: |
          "short_sha=$($env:GITHUB_SHA.Substring(0, 12))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-windows-x86_64-ucrt-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/windows

      - name: Install Package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem -Path 'artifacts/packages/windows' -Filter 'omnirefl-*.zip' |
            Sort-Object Name |
            Select-Object -Last 1
          if ($null -eq $package) {
            throw 'Windows package artifact was not found'
          }

          $root = Join-Path $env:RUNNER_TEMP 'with space'
          $install = Join-Path $root 'omnirefl'
          $source = Join-Path $root 'tests'
          $build = Join-Path $root 'build'
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/test-results/windows-${{ matrix.toolchain }}'
          New-Item -ItemType Directory -Force -Path $root, $results | Out-Null
          Expand-Archive -Path $package.FullName -DestinationPath $root -Force

          $packageRoot = Get-ChildItem -Path $root -Directory -Filter 'omnirefl-*' |
            Sort-Object Name |
            Select-Object -First 1
          if ($null -eq $packageRoot) {
            throw 'could not find extracted omnirefl package root'
          }

          Move-Item $packageRoot.FullName $install
          Copy-Item -Recurse (Join-Path $install 'share/omnirefl/tests') $root
          & (Join-Path $install 'bin/omnirefl.exe') -h

          @(
            "OMNIREFL_INSTALL_ROOT=$($install.Replace('\', '/'))"
            "OMNIREFL_TEST_SOURCE=$($source.Replace('\', '/'))"
            "OMNIREFL_TEST_BUILD=$($build.Replace('\', '/'))"
            "OMNIREFL_TEST_RESULTS=$($results.Replace('\', '/'))"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MSYS2 Toolchain
        if: ${{ startsWith(matrix.toolchain, 'msys2-') }}
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false
          update: true
          install: ${{ matrix.packages }}

      - name: Run MSVC-compatible Package Tests
        if: ${{ 'msvc' == matrix.toolchain || 'clang-cl' == matrix.toolchain }}
        # Windows PowerShell promotes ordinary native stderr (for example,
        # Git's clone progress) to NativeCommandError under the runner's strict
        # error preference. PowerShell 7 preserves it as process output; the
        # explicit exit-code checks below still reject real command failures.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw 'Visual Studio with the x64 C++ toolchain was not found'
          }

          $vsDevCmd = Join-Path $vsInstall 'Common7/Tools/VsDevCmd.bat'
          $vsEnv = & $env:ComSpec /d /c "`"$vsDevCmd`" -arch=x64 >nul && set"
          if (0 -ne $LASTEXITCODE) {
            throw 'failed to initialize the Visual Studio environment'
          }

          foreach ($line in $vsEnv) {
            if ($line -match '^(.*?)=(.*)$') {
              Set-Item -Path ('Env:' + $Matches[1]) -Value $Matches[2]
            }
          }

          if ('clang-cl' -eq '${{ matrix.toolchain }}') {
            $llvmBin = 'C:/Program Files/LLVM/bin'
            if (!(Test-Path (Join-Path $llvmBin 'clang-cl.exe'))) {
              throw 'clang-cl was not found in the hosted runner LLVM installation'
            }

            $env:Path = "$llvmBin;$env:Path"
            $env:CC = 'clang-cl'
            $env:CXX = 'clang-cl'
          }

          New-Item -ItemType Directory -Force -Path $env:OMNIREFL_TEST_BUILD | Out-Null
          Set-Location $env:OMNIREFL_TEST_BUILD

          cmake ../tests -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            "-Domnirefl_DIR=$env:OMNIREFL_INSTALL_ROOT/lib/cmake/omnirefl" 2>&1 |
            Tee-Object "$env:OMNIREFL_TEST_RESULTS/configure.log"
          if (0 -ne $LASTEXITCODE) { exit $LASTEXITCODE }

          cmake --build . `
            --parallel $env:NUMBER_OF_PROCESSORS 2>&1 |
            Tee-Object "$env:OMNIREFL_TEST_RESULTS/build.log"
          if (0 -ne $LASTEXITCODE) { exit $LASTEXITCODE }

          ctest . `
            --output-junit "$env:OMNIREFL_TEST_RESULTS/windows-${{ matrix.toolchain }}.xml" `
            -V 2>&1 |
            Tee-Object "$env:OMNIREFL_TEST_RESULTS/windows-${{ matrix.toolchain }}.log"
          exit $LASTEXITCODE

      - name: Run MSYS2 Package Tests
        if: ${{ startsWith(matrix.toolchain, 'msys2-') }}
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          install_root="$(cygpath -u "$OMNIREFL_INSTALL_ROOT")"
          build_dir="$(cygpath -u "$OMNIREFL_TEST_BUILD")"
          results_dir="$(cygpath -u "$OMNIREFL_TEST_RESULTS")"

          mkdir -p "$build_dir"
          cd "$build_dir"

          cmake ../tests -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -Domnirefl_DIR="$install_root/lib/cmake/omnirefl" 2>&1 |
            tee "$results_dir/configure.log"

          cmake --build . --parallel "$(nproc)" 2>&1 |
            tee "$results_dir/build.log"

          set +e
          ctest . \
            --output-junit "$results_dir/windows-${{ matrix.toolchain }}.xml" \
            -V 2>&1 |
            tee "$results_dir/windows-${{ matrix.toolchain }}.log"
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Collect Test Diagnostics
        if: always()
        shell: powershell
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'with space/build'
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/test-results/windows-${{ matrix.toolchain }}'
          $diagnostics = Join-Path $results 'diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

          Copy-Item -ErrorAction SilentlyContinue -Destination $diagnostics -Path @(
            (Join-Path $build 'CMakeCache.txt')
            (Join-Path $build 'compile_commands.json')
            (Join-Path $build 'Testing/Temporary/LastTest.log')
            (Join-Path $build 'CMakeFiles/CMakeError.log')
          )

          $generated = @(Get-ChildItem -ErrorAction SilentlyContinue -Recurse -File `
            -Path $build -Include '*.omnirefl.hpp', '*.omnirefl.hpp.d')
          if (0 -lt $generated.Count) {
            Compress-Archive -Path $generated.FullName `
              -DestinationPath (Join-Path $diagnostics 'generated-reflection.zip') `
              -Force
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-windows-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/windows-${{ matrix.toolchain }}
          if-no-files-found: error

  aggregate-test-results:
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows]
    permissions:
      contents: read
      actions: write
    if: always()

    steps:
      - name: Find previous aggregate artifact
        id: previous_aggregate
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })

            const artifact = artifacts
              .filter(({name}) =>
                name.startsWith('aggregated-test-results-attempt-'))
              .sort((lhs, rhs) =>
                new Date(rhs.created_at) - new Date(lhs.created_at))[0]

            core.setOutput('name', artifact?.name ?? '')

      - name: Download previous aggregate artifact
        id: download_previous
        if: ${{ '' != steps.previous_aggregate.outputs.name }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.previous_aggregate.outputs.name }}
          path: ./test-results

      - name: Download test artifacts
        id: download_tests
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ./test-results

      - name: Upload aggregated test artifact
        id: upload_agg
        if: >-
          ${{
            always()
            && 'success' == steps.download_tests.outcome
            && (
              '' == steps.previous_aggregate.outputs.name
              || 'success' == steps.download_previous.outcome
            )
          }}
        uses: actions/upload-artifact@v6
        with:
          name: aggregated-test-results-attempt-${{ github.run_attempt }}
          path: ./test-results
          if-no-files-found: error

      - name: Clean up intermediate artifacts
        if: >-
          ${{
            always()
            && 'success' == steps.upload_agg.outcome
            && (
              'pull_request' != github.event_name
              || github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              })

            for (const artifact of artifacts.filter(({name}) =>
              name.startsWith('test-'))) {
              core.info(`deleting intermediate artifact: ${artifact.name}`)
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              })
            }
