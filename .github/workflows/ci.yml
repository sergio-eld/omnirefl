name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Package tests use the same public shape as docker-compose.yml:
  #
  #   platform=<alpine|ubuntu-18.04|ubuntu-20.04|ubuntu-22.04|windows>
  #   toolchain=<gcc|clang|mingw|msvc|clang-cl|msys2-mingw|msys2-clang>
  #
  # Alpine and Windows still dispatch to dedicated compose services because
  # their package install/runtime shells differ from Ubuntu.
  build-package:
    name: Build package / ${{ matrix.os }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        arch: [x86_64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_DOCKER_READ }}

      - name: Pull build-alpine Image
        run: docker pull ghcr.io/sergio-eld/omnirefl-build-alpine:latest

      - name: Build and package omnirefl tool
        run: |
          PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }} \
          PACKAGE_DIR=./artifacts/packages/${{ matrix.os }} \
            docker compose run --rm build-${{ matrix.os }}

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/${{ matrix.os }}
          if-no-files-found: error

  test-linux:
    name: Linux test / ${{ matrix.platform }}-${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        platform: [alpine, ubuntu-18.04, ubuntu-20.04, ubuntu-22.04]
        toolchain: [gcc, clang, mingw]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_DOCKER_READ }}

      - name: Pull Docker Image
        run: |
          if [ "alpine" = "${{ matrix.platform }}" ]; then
            docker pull ghcr.io/sergio-eld/test-alpine:latest
          else
            docker pull ghcr.io/sergio-eld/test-${{ matrix.platform }}-${{ matrix.toolchain }}
          fi

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-linux-x86_64-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/linux

      - name: Run Package Test
        run: |
          if [ "alpine" = "${{ matrix.platform }}" ]; then
            TOOLCHAIN=${{ matrix.toolchain }} \
            LINUX_PACKAGE_DIR=./artifacts/packages/linux \
            TEST_RESULTS_DIR=./artifacts/test-results/${{ matrix.platform }}-${{ matrix.toolchain }} \
              docker compose run --rm test-alpine
          else
            TEST_PLATFORM=${{ matrix.platform }} \
            TOOLCHAIN=${{ matrix.toolchain }} \
            LINUX_PACKAGE_DIR=./artifacts/packages/linux \
            TEST_RESULTS_DIR=./artifacts/test-results/${{ matrix.platform }}-${{ matrix.toolchain }} \
              docker compose run --rm test-ubuntu
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-${{ matrix.platform }}-${{ matrix.toolchain }}
          path: ./artifacts/test-results/${{ matrix.platform }}-${{ matrix.toolchain }}
          if-no-files-found: error

  test-windows:
    name: Windows test / ${{ matrix.toolchain }}
    runs-on: [self-hosted, windows, x64]
    needs: build-package
    env:
      WORK_DIR: ${{ matrix.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clang-cl, msys2-mingw, msys2-clang]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Self-hosted Windows runners reuse the workspace between matrix rows.
          # Keep rows in separate checkout directories so each checkout cleans
          # only its own previous state.
          path: ${{ env.WORK_DIR }}

      - name: Resolve Short SHA
        id: commit
        shell: powershell
        run: |
          "short_sha=$($env:GITHUB_SHA.Substring(0, 12))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_DOCKER_READ }}

      - name: Pull Docker Image
        shell: powershell
        working-directory: ${{ env.WORK_DIR }}
        run: |
          switch ("${{ matrix.toolchain }}") {
            "msvc" { docker pull ghcr.io/sergio-eld/test-windows-msvc }
            "clang-cl" { docker pull ghcr.io/sergio-eld/test-windows-clang-cl }
            "msys2-mingw" { docker pull ghcr.io/sergio-eld/test-windows-msys2 }
            "msys2-clang" { docker pull ghcr.io/sergio-eld/test-windows-msys2 }
            default { throw "unsupported Windows toolchain: ${{ matrix.toolchain }}" }
          }

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-windows-x86_64-${{ steps.commit.outputs.short_sha }}
          path: ./${{ env.WORK_DIR }}/artifacts/packages/windows

      - name: Run Package Test
        shell: powershell
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if ($null -eq (Get-ChildItem -Path "artifacts/packages/windows" -Filter "omnirefl-*.zip" | Select-Object -First 1)) {
            throw "Windows package artifact was not found"
          }

          $service = switch ("${{ matrix.toolchain }}") {
            "msvc" { "test-windows-msvc" }
            "clang-cl" { "test-windows-msvc" }
            "msys2-mingw" { "test-windows-msys2" }
            "msys2-clang" { "test-windows-msys2" }
            default { throw "unsupported Windows toolchain: ${{ matrix.toolchain }}" }
          }

          $results = New-Item -ItemType Directory -Force -Path "artifacts/test-results/windows-${{ matrix.toolchain }}"
          $env:TOOLCHAIN = "${{ matrix.toolchain }}"
          $env:WINDOWS_PACKAGE_DIR = (Resolve-Path "artifacts/packages/windows").Path
          $env:TEST_RESULTS_DIR = $results.FullName
          docker compose --project-name "${{ env.WORK_DIR }}" run --rm $service

      - name: Cleanup Docker Compose Project
        if: always()
        shell: powershell
        working-directory: ${{ env.WORK_DIR }}
        run: |
          docker compose --project-name "${{ env.WORK_DIR }}" down --remove-orphans

      - name: Normalize Test Result Permissions
        if: always()
        shell: powershell
        working-directory: ${{ env.WORK_DIR }}
        run: |
          $results = "artifacts/test-results/windows-${{ matrix.toolchain }}"
          if (Test-Path $results) {
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Get-ChildItem -LiteralPath $results -Recurse -Force |
              ForEach-Object { $_.Attributes = $_.Attributes -band (-bnot [System.IO.FileAttributes]::ReadOnly) }
            icacls $results /grant "${identity}:(OI)(CI)F" /T /C | Out-Host
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-windows-${{ matrix.toolchain }}
          path: ./${{ env.WORK_DIR }}/artifacts/test-results/windows-${{ matrix.toolchain }}
          if-no-files-found: error

  aggregate-test-results:
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows]
    permissions:
      contents: read
      actions: write
    if: always()

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ./test-results
          merge-multiple: true

      - name: Upload aggregated test artifact
        id: upload_agg
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-test-results
          path: ./test-results
          if-no-files-found: error

      - name: Clean up intermediate artifacts
        if: ${{ always() && 'success' == steps.upload_agg.outcome }}
        uses: geekyeggo/delete-artifact@v6
        with:
          name: test-*
          failOnError: false
