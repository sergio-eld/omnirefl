name: CI
run-name: CI / ${{ 'pull_request' == github.event_name && github.event.pull_request.head.ref || github.ref_name }}

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_symbols:
        description: Upload detached debug symbols for release assembly
        type: boolean
        required: false
        default: false

jobs:
  build-package-musl:
    name: Build package / ${{ matrix.os }}-${{ matrix.arch }}
    # As of this writing, GitHub provides no `ubuntu-latest-arm` label. Use the
    # versioned ARM runner to avoid emulating AArch64 builds on an x86_64 host.
    runs-on: ${{ 'aarch64' == matrix.arch && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      PACKAGE_RUNTIME: ${{ 'linux' == matrix.os && 'musl' || 'ucrt' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        arch: [x86_64, aarch64]
        # As of this writing, the MinGW cross-toolchain used here does not
        # provide a working Windows AArch64 package build.
        exclude:
          - os: windows
            arch: aarch64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Pull Build Image
        run: |
          # Compose owns the toolchain versions and resolves the complete image
          # tag for the selected build service.
          service=build-$PACKAGE_RUNTIME
          if [ "aarch64" = "${{ matrix.arch }}" ]; then
            service=$service-aarch64
          fi
          docker compose pull "$service"

      - name: Build and package omnirefl tool
        run: |
          PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }} \
          PACKAGE_DIR=./artifacts/packages/$PACKAGE_RUNTIME \
            docker compose run --rm \
              build-$PACKAGE_RUNTIME${{ 'aarch64' == matrix.arch && '-aarch64' || '' }}

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}${{ 'linux' == matrix.os && '-musl' || '-ucrt' }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/${{ env.PACKAGE_RUNTIME }}
          if-no-files-found: error

      - name: Stage Debug Symbols
        if: ${{ inputs.upload_symbols }}
        run: |
          shopt -s nullglob
          symbol_dirs=(./build-alpine/$PACKAGE_RUNTIME/${{ matrix.arch }}/*/symbols)
          test 1 -eq "${#symbol_dirs[@]}"
          mkdir -p ./artifacts/symbols
          cp "${symbol_dirs[0]}"/*.debug ./artifacts/symbols/

      - name: Upload Debug Symbols
        if: ${{ inputs.upload_symbols }}
        uses: actions/upload-artifact@v6
        with:
          name: symbols-${{ matrix.os }}-${{ matrix.arch }}${{ 'linux' == matrix.os && '-musl' || '-ucrt' }}-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/symbols
          if-no-files-found: error

  # Keep this outside the package matrix: the fat Cosmo link is much
  # slower than the musl/UCRT package links, but emits one cross-platform
  # package.
  build-package-cosmo:
    name: Build package / cosmo-universal
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Pull Cosmo Build Image
        # Compose owns the toolchain versions and resolves the complete image
        # tag for this build service.
        run: docker compose pull build-cosmo

      - name: Build Cosmo Package
        run: |
          PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }} \
          PACKAGE_DIR=./artifacts/packages/cosmo \
            docker compose run --rm build-cosmo

      - name: Upload Cosmo Package
        uses: actions/upload-artifact@v6
        with:
          name: packages-cosmo-universal-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/cosmo/omnirefl-cosmo-universal-*.tar.gz
          if-no-files-found: error

  # Package tests use the same matrix vocabulary as docker-compose.yml:
  #
  #   platform=<alpine|ubuntu-18.04|ubuntu-20.04|ubuntu-22.04|windows|macos>
  #   toolchain=<gcc|clang|mingw|msvc|clang-cl|msys2-mingw|msys2-clang>
  #
  # Linux rows dispatch to Compose services. Windows and macOS rows install
  # directly on GitHub-hosted runners; local Windows validation uses the
  # separate Compose services because its Windows container environment cannot
  # be reproduced by GitHub-hosted runners. Platform runners infer package
  # runtime and archive handling from filenames.
  test-package-linux:
    name: Package test / linux-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.toolchain }}
    # As of this writing, GitHub provides no `ubuntu-latest-arm` label. Use the
    # versioned ARM runner to execute AArch64 packages without emulation.
    runs-on: ${{ 'aarch64' == matrix.arch && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs:
      - build-package-musl
      - build-package-cosmo
    strategy:
      fail-fast: false
      # As of this writing, GitHub artifact downloads become unreliable when
      # every Linux row fetches the same large package archives concurrently.
      max-parallel: 4
      matrix:
        platform: [alpine, ubuntu-18.04, ubuntu-20.04, ubuntu-22.04]
        toolchain: [gcc, clang, mingw]
        arch: [x86_64, aarch64]
        exclude:
          - arch: aarch64
            platform: ubuntu-18.04
          - arch: aarch64
            platform: ubuntu-20.04
          - arch: aarch64
            toolchain: clang
          - arch: aarch64
            toolchain: mingw

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker Image
        run: |
          platform=${{ matrix.platform }}
          service=test-${platform%%-*}
          if [[ "$platform" == ubuntu-* ]]; then
            export UBUNTU_VERSION=${platform#ubuntu-}
            echo "UBUNTU_VERSION=$UBUNTU_VERSION" >> "$GITHUB_ENV"
          fi
          if [ "aarch64" = "${{ matrix.arch }}" ]; then
            service=$service-aarch64
          fi
          TOOLCHAIN=${{ matrix.toolchain }} docker compose pull "$service"
          echo "TEST_SERVICE=$service" >> "$GITHUB_ENV"

      - name: Verify Test Container Architecture
        run: |
          test "$(
            TOOLCHAIN=${{ matrix.toolchain }} \
              docker compose run --rm --entrypoint uname "$TEST_SERVICE" -m
          )" = "${{ matrix.arch }}"

      # Download the two inputs sequentially. Pattern mode uses the action's
      # multi-artifact path even when the pattern matches only one artifact.
      - name: Download musl Package
        uses: actions/download-artifact@v8
        with:
          name: packages-linux-${{ matrix.arch }}-musl-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/current

      - name: Download Cosmo Package
        uses: actions/download-artifact@v8
        with:
          name: packages-cosmo-universal-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/current

      - name: Run Package Test
        run: |
          TOOLCHAIN=${{ matrix.toolchain }} \
          PACKAGE_DIR=./artifacts/packages/current \
          TEST_NAME=linux-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.toolchain }} \
          TEST_RESULTS_DIR=./artifacts/test-results/linux-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.toolchain }} \
            docker compose run --rm "$TEST_SERVICE"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-linux-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/linux-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.toolchain }}
          if-no-files-found: error

  test-package-macos:
    name: Package test / ${{ matrix.runner }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-package-cosmo
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            host_arch: x86_64
          - runner: macos-26-intel
            arch: x86_64
            host_arch: x86_64
          - runner: macos-15
            arch: aarch64
            host_arch: arm64
          - runner: macos-26
            arch: aarch64
            host_arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Download Cosmo Package
        uses: actions/download-artifact@v8
        with:
          name: packages-cosmo-universal-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/cosmo

      - name: Run Package Tests
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/artifacts/test-results/${{ matrix.runner }}-${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.host_arch }}"
          packages=(artifacts/packages/cosmo/*.tar.gz)
          test 1 -eq "${#packages[@]}"
          ci/test_package.sh \
            --package "${packages[0]}" \
            --name "${{ matrix.runner }}-${{ matrix.arch }}" \
            --results "$results"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-${{ matrix.runner }}-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/${{ matrix.runner }}-${{ matrix.arch }}
          if-no-files-found: error

  test-package-windows:
    name: Package test / windows-${{ matrix.toolchain }}
    runs-on: windows-2022
    needs:
      - build-package-musl
      - build-package-cosmo
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clang-cl, msys2-mingw, msys2-clang]
        include:
          - toolchain: msys2-mingw
            msystem: MINGW64
            cc: gcc
            cxx: g++
            packages: >-
              git
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-gcc
          - toolchain: msys2-clang
            msystem: CLANG64
            cc: clang
            cxx: clang++
            packages: >-
              git
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
              mingw-w64-clang-x86_64-clang

    steps:
      - name: Resolve Short SHA
        id: commit
        run: '"short_sha=$($env:GITHUB_SHA.Substring(0, 12))" >> $env:GITHUB_OUTPUT'

      - name: Download UCRT Package
        uses: actions/download-artifact@v8
        with:
          name: packages-windows-x86_64-ucrt-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/current

      - name: Download Cosmo Package
        uses: actions/download-artifact@v8
        with:
          name: packages-cosmo-universal-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/current

      - name: Install Packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -Path 'artifacts/packages/current' -Recurse -File | Where-Object {
            $_.Name -like 'omnirefl-windows-x86_64-ucrt-*.zip' -or
              $_.Name -like 'omnirefl-cosmo-universal-*.tar.gz'
          })
          $root = Join-Path $env:RUNNER_TEMP 'with space/packages'
          $results = Join-Path $env:GITHUB_WORKSPACE 'artifacts/test-results/windows-${{ matrix.toolchain }}'
          New-Item -ItemType Directory -Force -Path $root, $results | Out-Null
          $installed = @{}

          foreach ($archive in $archives) {
            if ($archive.Name -like '*-ucrt-*') {
              $runtime = 'ucrt'
            } elseif ($archive.Name -like '*-cosmo-*') {
              $runtime = 'cosmo'
            } else {
              throw "cannot infer package runtime from $($archive.Name)"
            }
            if ($installed.ContainsKey($runtime)) {
              throw "multiple $runtime packages"
            }

            $extract = Join-Path $root "extract-$runtime"
            $package = Join-Path $root $runtime
            New-Item -ItemType Directory -Force -Path $extract, $package | Out-Null
            if ($archive.Name.EndsWith('.zip')) {
              Expand-Archive -Path $archive.FullName -DestinationPath $extract -Force
            } else {
              tar -xzf $archive.FullName -C $extract
              if (0 -ne $LASTEXITCODE) { exit $LASTEXITCODE }
            }

            $packageRoots = @(Get-ChildItem -Path $extract -Directory -Filter 'omnirefl-*')
            if (1 -ne $packageRoots.Count) {
              throw "expected one package root in $($archive.Name)"
            }

            $install = Join-Path $package 'install'
            Move-Item $packageRoots[0].FullName $install
            Remove-Item -Recurse $extract
            Copy-Item -Recurse (Join-Path $install 'share/omnirefl/tests') $package
            & (Join-Path $install 'bin/omnirefl.exe') -h
            if (0 -ne $LASTEXITCODE) { exit $LASTEXITCODE }
            & (Join-Path $install 'bin/ccdb_query.exe') -h
            if (0 -ne $LASTEXITCODE) { exit $LASTEXITCODE }
            $installed[$runtime] = $true
          }

          if (!$installed.ContainsKey('ucrt')) {
            throw 'UCRT package was not installed'
          }
          if (!$installed.ContainsKey('cosmo')) {
            throw 'Cosmo package was not installed'
          }

          @(
            "OMNIREFL_PACKAGES_ROOT=$($root.Replace('\', '/'))"
            "OMNIREFL_TEST_RESULTS=$($results.Replace('\', '/'))"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install MSYS2 Toolchain
        if: ${{ startsWith(matrix.toolchain, 'msys2-') }}
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false
          update: true
          install: ${{ matrix.packages }}

      - name: Run MSVC-compatible Package Tests
        if: ${{ 'msvc' == matrix.toolchain || 'clang-cl' == matrix.toolchain }}
        # Windows PowerShell promotes ordinary native stderr (for example,
        # Git's clone progress) to NativeCommandError under the runner's strict
        # error preference. PowerShell 7 preserves it as process output; the
        # explicit exit-code checks below still reject real command failures.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw 'Visual Studio with the x64 C++ toolchain was not found'
          }

          $vsDevCmd = Join-Path $vsInstall 'Common7/Tools/VsDevCmd.bat'
          $vsEnv = & $env:ComSpec /d /c "`"$vsDevCmd`" -arch=x64 >nul && set"
          if (0 -ne $LASTEXITCODE) {
            throw 'failed to initialize the Visual Studio environment'
          }

          foreach ($line in $vsEnv) {
            if ($line -match '^(.*?)=(.*)$') {
              Set-Item -Path ('Env:' + $Matches[1]) -Value $Matches[2]
            }
          }

          if ('clang-cl' -eq '${{ matrix.toolchain }}') {
            $llvmBin = 'C:/Program Files/LLVM/bin'
            if (!(Test-Path (Join-Path $llvmBin 'clang-cl.exe'))) {
              throw 'clang-cl was not found in the hosted runner LLVM installation'
            }

            $env:Path = "$llvmBin;$env:Path"
            $env:CC = 'clang-cl'
            $env:CXX = 'clang-cl'
          }

          $result = 0
          foreach ($package in Get-ChildItem -Path $env:OMNIREFL_PACKAGES_ROOT -Directory) {
            $install = Join-Path $package.FullName 'install'
            $source = Join-Path $package.FullName 'tests'
            $build = Join-Path $package.FullName 'build'
            $results = Join-Path $env:OMNIREFL_TEST_RESULTS $package.Name
            New-Item -ItemType Directory -Force -Path $build, $results | Out-Null

            cmake -S $source -B $build -GNinja `
              -DCMAKE_BUILD_TYPE=Release `
              "-Domnirefl_DIR=$install/lib/cmake/omnirefl" 2>&1 |
              Tee-Object (Join-Path $results 'configure.log')
            $configureResult = $LASTEXITCODE
            if (0 -ne $configureResult) {
              $result = $configureResult
              continue
            }

            cmake --build $build `
              --parallel $env:NUMBER_OF_PROCESSORS 2>&1 |
              Tee-Object (Join-Path $results 'build.log')
            $buildResult = $LASTEXITCODE
            if (0 -ne $buildResult) {
              $result = $buildResult
              continue
            }

            ctest --test-dir $build `
              --output-junit (Join-Path $results "windows-${{ matrix.toolchain }}.xml") `
              -V 2>&1 |
              Tee-Object (Join-Path $results "windows-${{ matrix.toolchain }}.log")
            $testResult = $LASTEXITCODE
            if (0 -ne $testResult) {
              $result = $testResult
            }
          }
          exit $result

      - name: Run MSYS2 Package Tests
        if: ${{ startsWith(matrix.toolchain, 'msys2-') }}
        shell: msys2 {0}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          packages_root="$(cygpath -u "$OMNIREFL_PACKAGES_ROOT")"
          results_dir="$(cygpath -u "$OMNIREFL_TEST_RESULTS")"
          result=0

          for package in "$packages_root"/*; do
            name="$(basename "$package")"
            install="$package/install"
            source="$package/tests"
            build="$package/build"
            results="$results_dir/$name"
            mkdir -p "$build" "$results"

            set +e
            cmake -S "$source" -B "$build" -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -Domnirefl_DIR="$install/lib/cmake/omnirefl" 2>&1 |
              tee "$results/configure.log"
            configure_result=${PIPESTATUS[0]}
            set -e
            if ((0 != configure_result)); then
              result=$configure_result
              continue
            fi

            set +e
            cmake --build "$build" --parallel "$(nproc)" 2>&1 |
              tee "$results/build.log"
            build_result=${PIPESTATUS[0]}
            set -e
            if ((0 != build_result)); then
              result=$build_result
              continue
            fi

            set +e
            ctest --test-dir "$build" \
              --output-junit "$results/windows-${{ matrix.toolchain }}.xml" \
              -V 2>&1 |
              tee "$results/windows-${{ matrix.toolchain }}.log"
            test_result=${PIPESTATUS[0]}
            set -e
            if ((0 != test_result)); then
              result=$test_result
            fi
          done
          exit "$result"

      - name: Collect Test Diagnostics
        if: always()
        shell: powershell
        run: |
          foreach ($package in Get-ChildItem -Path $env:OMNIREFL_PACKAGES_ROOT -Directory) {
            $build = Join-Path $package.FullName 'build'
            $results = Join-Path $env:OMNIREFL_TEST_RESULTS $package.Name
            $diagnostics = Join-Path $results 'diagnostics'
            New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null

            Copy-Item -ErrorAction SilentlyContinue -Destination $diagnostics -Path @(
              (Join-Path $build 'CMakeCache.txt')
              (Join-Path $build 'compile_commands.json')
              (Join-Path $build 'Testing/Temporary/LastTest.log')
              (Join-Path $build 'CMakeFiles/CMakeError.log')
            )

            $generated = @(Get-ChildItem -ErrorAction SilentlyContinue -Recurse -File `
              -Path $build -Include '*.omnirefl.hpp', '*.omnirefl.hpp.d')
            if (0 -lt $generated.Count) {
              Compress-Archive -Path $generated.FullName `
                -DestinationPath (Join-Path $diagnostics 'generated-reflection.zip') `
                -Force
            }
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            test-windows-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/test-results/windows-${{ matrix.toolchain }}
          if-no-files-found: error

  benchmark-macos:
    name: Benchmark / macos-${{ matrix.arch }}-cosmo
    runs-on: ${{ matrix.runner }}
    needs: build-package-cosmo
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            host_arch: x86_64
          - runner: macos-15
            arch: aarch64
            host_arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Download Cosmo Package
        uses: actions/download-artifact@v8
        with:
          name: packages-cosmo-universal-${{ steps.commit.outputs.short_sha }}
          path: ./artifacts/packages/cosmo

      - name: Install Cosmo Package
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/with space"
          install="$root/omnirefl"
          build="$root/build"
          results="$GITHUB_WORKSPACE/artifacts/benchmarks/macos-${{ matrix.arch }}-cosmo"
          mkdir -p "$root" "$results"
          test "$(uname -m)" = "${{ matrix.host_arch }}"

          package="$(find artifacts/packages/cosmo \
            -maxdepth 1 -type f \
            -name 'omnirefl-cosmo-universal-*.tar.gz' \
            -print -quit)"
          test -n "$package"
          tar -xzf "$package" -C "$root"

          package_root="$(find "$root" -mindepth 1 -maxdepth 1 \
            -type d -name 'omnirefl-*' -print -quit)"
          test -n "$package_root"
          mv "$package_root" "$install"

          {
            echo "OMNIREFL_INSTALL_ROOT=$install"
            echo "OMNIREFL_BENCHMARK_BUILD=$build"
            echo "OMNIREFL_BENCHMARK_RESULTS=$results"
          } >> "$GITHUB_ENV"

      - name: Run benchmark
        run: |
          ci/benchmark_package.sh \
            --install "$OMNIREFL_INSTALL_ROOT" \
            --build "$OMNIREFL_BENCHMARK_BUILD" \
            --results "$OMNIREFL_BENCHMARK_RESULTS" \
            --name "macos-${{ matrix.arch }}-cosmo"

      - name: Find macOS benchmark history artifact
        id: macos_history_run
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const workflow_id = 'ci.yml'
            const branch = context.payload.repository.default_branch
            const historyArtifactPrefix =
              'benchmark-history-macos-${{ matrix.arch }}-cosmo'

            const historyArtifactFrom = async (run_id) => {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id, per_page: 100})

              return artifacts
                .filter(({expired, name}) =>
                  !expired && (
                    historyArtifactPrefix === name ||
                    name.startsWith(`${historyArtifactPrefix}-attempt-`)))
                .sort((lhs, rhs) =>
                  new Date(rhs.created_at) - new Date(lhs.created_at))[0]
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id,
                branch,
                status: 'success',
                per_page: 20,
              })

            for (const run of runs) {
              if (context.runId === run.id) {
                continue
              }

              const artifact = await historyArtifactFrom(run.id)
              if (artifact) {
                core.setOutput('run_id', run.id)
                core.setOutput('artifact_name', artifact.name)
                return
              }
            }

            core.setOutput('run_id', '')

      - name: Download macOS benchmark history
        if: ${{ '' != steps.macos_history_run.outputs.run_id }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.macos_history_run.outputs.artifact_name }}
          path: ./artifacts/benchmark-history/macos-${{ matrix.arch }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.macos_history_run.outputs.run_id }}

      - name: Prepare macOS benchmark history
        run: mkdir -p ./artifacts/benchmark-history/macos-${{ matrix.arch }}

      - name: Check macOS benchmark regression
        run: |
          python3 -B ci/benchmark_history.py compare \
            --current ./artifacts/benchmarks/macos-${{ matrix.arch }}-cosmo/benchmark.json \
            --history ./artifacts/benchmark-history/macos-${{ matrix.arch }}/history.json \
            --os macos-${{ matrix.arch }}-cosmo \
            --arch ${{ matrix.arch }} \
            --libc cosmo \
            --threshold 1.2 \
            --min-delta-ms 500 \
            --count 5

      - name: Update macOS benchmark history
        if: ${{ 'push' == github.event_name && 'master' == github.ref_name }}
        env:
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
        run: |
          python3 -B ci/benchmark_history.py update \
            --current ./artifacts/benchmarks/macos-${{ matrix.arch }}-cosmo/benchmark.json \
            --history ./artifacts/benchmark-history/macos-${{ matrix.arch }}/history.json \
            --commit "${{ github.sha }}" \
            --commit-title "$COMMIT_TITLE" \
            --os macos-${{ matrix.arch }}-cosmo \
            --arch ${{ matrix.arch }} \
            --libc cosmo \
            --max-runs 200

      - name: Upload macOS benchmark history
        if: ${{ success() && 'push' == github.event_name && 'master' == github.ref_name }}
        uses: actions/upload-artifact@v6
        with:
          name: >-
            benchmark-history-macos-${{ matrix.arch }}-cosmo-attempt-${{ github.run_attempt }}
          path: ./artifacts/benchmark-history/macos-${{ matrix.arch }}
          if-no-files-found: error

      - name: Upload macOS benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-macos-${{ matrix.arch }}-cosmo-attempt-${{ github.run_attempt }}
          path: ./artifacts/benchmarks/macos-${{ matrix.arch }}-cosmo
          if-no-files-found: error

  benchmark-musl:
    name: Benchmark / ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    needs: build-package-musl
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [linux]
        arch: [x86_64]
        libc: [musl]
        toolchain: [gcc]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Short SHA
        id: commit
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      # Docker bind mounts must not create the shared parent as root before
      # the runner writes benchmark history into it.
      - name: Prepare benchmark directories
        run: |
          mkdir -p ./artifacts/benchmark-history
          mkdir -p ./artifacts/packages/benchmark-musl
          mkdir -p ./artifacts/benchmarks
          mkdir -p ./artifacts/benchmark-build

      - name: Pull Benchmark Build Image
        run: docker compose pull build-benchmark-musl

      - name: Build Release Benchmark Input
        run: |
          PACKAGE_COMMIT=${{ steps.commit.outputs.short_sha }} \
          PACKAGE_DIR=./artifacts/packages/benchmark-musl \
            docker compose run --rm build-benchmark-musl

      - name: Run benchmark
        run: |
          TOOLCHAIN=${{ matrix.toolchain }} \
          PACKAGE_DIR=./artifacts/packages/benchmark-musl \
          TEST_RESULTS_DIR=./artifacts/benchmarks \
          BUILD_DIR=./artifacts/benchmark-build/${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }} \
            docker compose run --rm benchmark

      - name: Find benchmark history artifact
        id: history_run
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const workflow_id = 'ci.yml'
            const branch = context.payload.repository.default_branch
            const historyArtifactPrefix =
              'benchmark-history-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }}'

            const historyArtifactFrom = async (run_id) => {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id, per_page: 100})

              return artifacts
                .filter(({expired, name}) =>
                  !expired && (
                    historyArtifactPrefix === name ||
                    name.startsWith(`${historyArtifactPrefix}-attempt-`)))
                .sort((lhs, rhs) =>
                  new Date(rhs.created_at) - new Date(lhs.created_at))[0]
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id,
                branch,
                status: 'success',
                per_page: 20,
              })

            for (const run of runs) {
              if (context.runId === run.id) {
                continue
              }

              const artifact = await historyArtifactFrom(run.id)
              if (artifact) {
                core.setOutput('run_id', run.id)
                core.setOutput('artifact_name', artifact.name)
                return
              }
            }

            core.setOutput('run_id', '')

      - name: Download benchmark history
        if: ${{ '' != steps.history_run.outputs.run_id }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.history_run.outputs.artifact_name }}
          path: ./artifacts/benchmark-history
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.history_run.outputs.run_id }}

      - name: Check benchmark regression
        run: |
          python3 -B ci/benchmark_history.py compare \
            --current ./artifacts/benchmarks/benchmark.json \
            --history ./artifacts/benchmark-history/history.json \
            --os ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }} \
            --arch ${{ matrix.arch }} \
            --libc ${{ matrix.libc }} \
            --threshold 1.2 \
            --min-delta-ms 500 \
            --count 5

      - name: Update benchmark history
        if: ${{ 'push' == github.event_name && 'master' == github.ref_name }}
        env:
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
        run: |
          python3 -B ci/benchmark_history.py update \
            --current ./artifacts/benchmarks/benchmark.json \
            --history ./artifacts/benchmark-history/history.json \
            --commit "${{ github.sha }}" \
            --commit-title "$COMMIT_TITLE" \
            --os ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }} \
            --arch ${{ matrix.arch }} \
            --libc ${{ matrix.libc }} \
            --max-runs 200

      # TODO: after release or once the repository is public, move benchmark
      # history away from artifact storage. GitHub artifacts are easy to delete,
      # so this is only a temporary private-repo storage workaround.
      - name: Upload benchmark history
        if: ${{ success() && 'push' == github.event_name && 'master' == github.ref_name }}
        uses: actions/upload-artifact@v6
        with:
          name: >-
            benchmark-history-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/benchmark-history
          if-no-files-found: error

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            benchmark-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.libc }}-${{ matrix.toolchain }}-attempt-${{ github.run_attempt }}
          path: ./artifacts/benchmarks
          if-no-files-found: error

