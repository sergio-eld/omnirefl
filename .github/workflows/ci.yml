name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull build-alpine Image
        run: docker pull sergioeld/omnirefl-build-alpine:latest

      - name: Build omnirefl tool
        run: |
          docker compose run --rm build

      # this should run in a test job, but it uses the docker compose file,
      # which resides in the git repo which would need to be checked out (again)
      - name: Run test
        run: docker compose run --rm build-tests

      # todo: packaging should not run on a merge request (? I think)
      - name: Package omnirefl tool
        run: |
          docker compose run --rm install

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-alpine
          path: ./build-alpine/

