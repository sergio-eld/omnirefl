name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull build-alpine Image
        run: docker pull sergioeld/omnirefl-build-alpine:latest

      - name: Build omnirefl tool for Linux
        run: |
          docker compose run --rm build-linux

      - name: Build omnirefl tool for Windows
        run: |
          docker compose run --rm build-windows

      # this should run in a test job, but it uses the docker compose file,
      # which resides in the git repo which would need to be checked out (again)
      # also it depends on the cmake configuration. 
      - name: Run test
        run: docker compose run --rm build-tests-alpine

      # todo: packaging should not run on a merge request (? I think)
      - name: Package omnirefl tool for Linux
        run: |
          docker compose run --rm package-linux

      - name: Package omnirefl tool for Windows
        run: |
          docker compose run --rm package-windows
      
      # todo: test results and benchmarks (for continious bench)
      # todo: separate packages for windows and linux
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install
          path: ./build-alpine/*/install/
          if-no-files-found: error

      # todo: separate these tests to another job
      # - name: Test Ubuntu 18
      #   run: |
      #     docker compose run --rm test-install-ubuntu-18

      # - name: Test Ubuntu 20
      #   run: |
      #     docker compose run --rm test-install-ubuntu-20

      # - name: Test Ubuntu 22
      #   run: |
      #     docker compose run --rm test-install-ubuntu-22

      # - name: Upload Test Artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: test-result
      #     path: ./build-alpine/test/

  # todo: this should actually use the install package and test on several images
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # needed only for `docker-compose.yml`
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: install
          path: ./build-alpine/
    # todo: matrix to for testing on ubuntu [18, 20, 22] and windows


