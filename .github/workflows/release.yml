name: Release
run-name: Release / ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_PACKAGE_TARGETS: >-
    linux-x86_64-musl
    linux-aarch64-musl
    windows-x86_64-ucrt
    cosmo-universal
    extras
  RELEASE_SYMBOL_TARGETS: >-
    cosmo-universal
    linux-x86_64-musl
    linux-aarch64-musl
    windows-x86_64-ucrt

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      reuse_artifacts: ${{ steps.reuse.outputs.reuse_artifacts }}
      full_suite: ${{ steps.reusable_ci.outputs.full_suite }}
      rebuild_packages: ${{ steps.reusable_ci.outputs.run_id != '' && steps.reusable_ci.outputs.candidate != 'true' }}
    env:
      # Fine-grained token with read/write access to repository contents.
      GH_TOKEN: ${{ secrets.OMNIREFL_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Release Target
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OMNIREFL_RELEASE_TOKEN is not configured" >&2
            exit 1
          fi

          project_version=$(
            sed -n \
              '/^project(omnirefl/,/)/ s/^[[:space:]]*VERSION[[:space:]]\+\([^[:space:])]*\).*/\1/p' \
              CMakeLists.txt
          )
          if [ "v$project_version" != "$GITHUB_REF_NAME" ]; then
            printf 'release tag %s does not match project version %s\n' \
              "$GITHUB_REF_NAME" "$project_version" \
              >&2
            exit 1
          fi

          notes="docs/releases/$project_version.md"
          if [ ! -f "$notes" ] || ! grep -q '[^[:space:]]' "$notes"; then
            echo "missing or empty release notes: $notes" >&2
            exit 1
          fi

          python3 - "$project_version" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = tuple(map(int, sys.argv[1].split('.')))
          for notes in sorted(Path('docs/releases').glob('*.md')):
              if not re.fullmatch(r'\d+\.\d+\.\d+', notes.stem):
                  continue
              if version < tuple(map(int, notes.stem.split('.'))):
                  print(f'::warning file={notes}::Release notes for newer version '
                        f'{notes.stem} exist; preparing {sys.argv[1]}.')
          PY

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Wait for Commit CI and Import Artifacts
        id: reusable_ci
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITHUB_OUTPUT="$RUNNER_TEMP/reusable-ci.outputs" \
            python3 ci/reuse_ci.py find --wait-master --require-symbols \
              --targets $RELEASE_PACKAGE_TARGETS
          cat "$RUNNER_TEMP/reusable-ci.outputs" >> "$GITHUB_OUTPUT"
          source "$RUNNER_TEMP/reusable-ci.outputs"

          if [ -n "$run_id" ]; then
            for target in $RELEASE_PACKAGE_TARGETS; do
              args=(--packages-dir \
                "./reusable-artifacts/packages/packages-$target-${GITHUB_SHA::12}")
              if [ extras != "$target" ]; then
                args+=(--symbols-dir \
                  "./reusable-artifacts/symbols/symbols-$target-${GITHUB_SHA::12}")
              fi
              if ! python3 ci/reuse_ci.py download --run-id "$run_id" \
                --target "$target" "${args[@]}"; then
                echo '::warning::Selected CI artifacts could not be restored; rebuilding packages and symbols.'
                run_id=
                break
              fi
            done
          fi

          required_files_available() {
            local file
            for file in "$@"; do
              if [ ! -s "$file" ]; then
                printf 'reusable artifact file is missing: %s\n' "$file"
                return 1
              fi
            done
          }

          # Reused PR archives keep their tested commit suffix and contents.
          # Directory/artifact names still identify this release's commit.
          shopt -s nullglob
          required_package_available() {
            local target=$1
            local extension=$2
            local matches=(./reusable-artifacts/packages/packages-"$target"-"${GITHUB_SHA::12}"/omnirefl-"$target"-"$version"-*."$extension")
            [ 1 -eq "${#matches[@]}" ] && [ -s "${matches[0]}" ] || return 1
            local filename=${matches[0]##*/}
            local package_commit=${filename#"omnirefl-$target-$version-"}
            [[ "${package_commit%."$extension"}" =~ ^[0-9a-f]{12}$ ]]
          }

          version=${GITHUB_REF_NAME#v}
          if [ -n "$run_id" ]; then
            if ! required_files_available \
              "./reusable-artifacts/symbols/symbols-linux-x86_64-musl-${GITHUB_SHA::12}/omnirefl.debug" \
              "./reusable-artifacts/symbols/symbols-linux-x86_64-musl-${GITHUB_SHA::12}/ccdb_query.debug" \
              "./reusable-artifacts/symbols/symbols-linux-aarch64-musl-${GITHUB_SHA::12}/omnirefl.debug" \
              "./reusable-artifacts/symbols/symbols-linux-aarch64-musl-${GITHUB_SHA::12}/ccdb_query.debug" \
              "./reusable-artifacts/symbols/symbols-windows-x86_64-ucrt-${GITHUB_SHA::12}/omnirefl.exe.debug" \
              "./reusable-artifacts/symbols/symbols-windows-x86_64-ucrt-${GITHUB_SHA::12}/ccdb_query.exe.debug" \
              "./reusable-artifacts/symbols/symbols-cosmo-universal-${GITHUB_SHA::12}/x86_64/omnirefl.debug" \
              "./reusable-artifacts/symbols/symbols-cosmo-universal-${GITHUB_SHA::12}/x86_64/ccdb_query.debug" \
              "./reusable-artifacts/symbols/symbols-cosmo-universal-${GITHUB_SHA::12}/aarch64/omnirefl.debug" \
              "./reusable-artifacts/symbols/symbols-cosmo-universal-${GITHUB_SHA::12}/aarch64/ccdb_query.debug"; then
              run_id=
            fi
            for target in $RELEASE_PACKAGE_TARGETS; do
              extension=tar.gz
              if [ windows-x86_64-ucrt = "$target" ]; then extension=zip; fi
              if ! required_package_available "$target" "$extension"; then run_id=; fi
              if [[ "$target" = linux-*-musl ]] && \
                ! required_package_available "$target" deb; then run_id=; fi
            done
          fi

          if [ -n "$run_id" ]; then
            echo "imported release artifacts from successful CI run $run_id"
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete reusable CI artifacts were not found"
            echo "candidate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Reusable Release Artifacts
        id: reusable_artifacts
        if: ${{ 'true' == steps.reusable_ci.outputs.candidate }}
        uses: actions/upload-artifact@v6
        with:
          name: release-inputs-${{ github.sha }}
          path: ./reusable-artifacts
          if-no-files-found: error
          overwrite: true

      - name: Select Release Artifact Source
        id: reuse
        if: always()
        env:
          CANDIDATE: ${{ steps.reusable_ci.outputs.candidate }}
          UPLOAD_OUTCOME: ${{ steps.reusable_artifacts.outcome }}
        run: |
          reuse_artifacts=false
          if [ true = "$CANDIDATE" ] && [ success = "$UPLOAD_OUTCOME" ]; then
            reuse_artifacts=true
          elif [ true = "$CANDIDATE" ]; then
            echo "failed to pin reusable artifacts; retry release preflight to restage packages" >&2
            exit 1
          fi
          echo "reuse_artifacts=$reuse_artifacts" >> "$GITHUB_OUTPUT"

  validation:
    name: Build and validate release
    needs: preflight
    if: >-
      ${{ 'true' != needs.preflight.outputs.reuse_artifacts
        || 'true' != needs.preflight.outputs.full_suite }}
    uses: ./.github/workflows/ci.yml
    with:
      # Smoke packages are reusable independently of full-suite success.
      # An existing full-suite proof permits smoke-only package restoration.
      build_sources: true
      full_suite: ${{ 'true' != needs.preflight.outputs.full_suite }}
      rebuild_packages: ${{ needs.preflight.outputs.rebuild_packages == 'true' }}
      skip_pages: true
    # Ad hoc: `skip_pages` prevents deployment, but GitHub validates every
    # nested job's permission ceiling before evaluating its condition. The
    # tag-triggered caller must therefore still permit Pages. REFACTORME:
    # separate Pages deployment from reusable package validation.
    permissions:
      actions: write
      contents: read
      pull-requests: read
      id-token: write
      pages: write

  release:
    name: Create draft prerelease
    needs:
      - preflight
      - validation
    if: >-
      ${{
        always()
        && 'success' == needs.preflight.result
        && (
          'success' == needs.validation.result
          || (
            'skipped' == needs.validation.result
            && 'true' == needs.preflight.outputs.reuse_artifacts
            && 'true' == needs.preflight.outputs.full_suite
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.OMNIREFL_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Release Artifacts
        # Ad hoc: download-artifact currently fails for some artifacts uploaded
        # by Ubuntu runners. The REST download remains valid.
        # https://github.com/actions/upload-artifact/issues/811
        # REFACTORME: Restore download-artifact after the upstream fix ships.
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_ARTIFACTS: ${{ needs.preflight.outputs.reuse_artifacts }}
        run: |
          set -euo pipefail
          short_sha=${GITHUB_SHA::12}
          if [ true = "$REUSE_ARTIFACTS" ]; then
            python3 ci/github_artifacts.py --run-id "$GITHUB_RUN_ID" \
              --name "release-inputs-$GITHUB_SHA" --destination ./artifacts
          else
            for target in $RELEASE_PACKAGE_TARGETS; do
              python3 ci/github_artifacts.py --run-id "$GITHUB_RUN_ID" \
                --name "packages-$target-$short_sha" \
                --destination "./artifacts/packages/packages-$target-$short_sha"
            done
            for target in $RELEASE_SYMBOL_TARGETS; do
              python3 ci/github_artifacts.py --run-id "$GITHUB_RUN_ID" \
                --name "symbols-$target-$short_sha" \
                --destination "./artifacts/symbols/symbols-$target-$short_sha"
            done
          fi

      - name: Prepare Release Assets
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::12}"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"

          packages=(
            "omnirefl-linux-x86_64-musl-${version}-${short_sha}.deb"
            "omnirefl-linux-x86_64-musl-${version}-${short_sha}.tar.gz"
            "omnirefl-linux-aarch64-musl-${version}-${short_sha}.deb"
            "omnirefl-linux-aarch64-musl-${version}-${short_sha}.tar.gz"
            "omnirefl-windows-x86_64-ucrt-${version}-${short_sha}.zip"
            "omnirefl-cosmo-universal-${version}-${short_sha}.tar.gz"
            "omnirefl-extras-${version}-${short_sha}.tar.gz"
          )

          for package in "${packages[@]}"; do
            # Keep package bytes/binary IDs intact; only the published asset's
            # filename uses the release commit. Match the original PR suffix.
            prefix=${package%-"$short_sha".*}
            extension=${package##*-"$short_sha".}
            matches=(./artifacts/packages/*/"$prefix"-*."$extension")
            if [ 1 -ne "${#matches[@]}" ]; then
              echo "expected one $package, found ${#matches[@]}" >&2
              exit 1
            fi
            filename=${matches[0]##*/}
            package_commit=${filename#"$prefix"-}
            if [[ ! "${package_commit%."$extension"}" =~ ^[0-9a-f]{12}$ ]]; then
              echo "package lacks a tested commit suffix: ${matches[0]}" >&2
              exit 1
            fi

            cp "${matches[0]}" "$release_dir/$package"
          done

          for target in linux-x86_64-musl linux-aarch64-musl; do
            symbols="./artifacts/symbols/symbols-${target}-${short_sha}"
            test -s "$symbols/omnirefl.debug"
            test -s "$symbols/ccdb_query.debug"
            tar -czf \
              "$release_dir/omnirefl-${target}-${version}-${short_sha}-symbols.tar.gz" \
              -C "$symbols" omnirefl.debug ccdb_query.debug
          done

          symbols="./artifacts/symbols/symbols-cosmo-universal-${short_sha}"
          for arch in x86_64 aarch64; do
            test -s "$symbols/$arch/omnirefl.debug"
            test -s "$symbols/$arch/ccdb_query.debug"
          done
          tar -czf \
            "$release_dir/omnirefl-cosmo-universal-${version}-${short_sha}-symbols.tar.gz" \
            -C "$symbols" x86_64 aarch64

          symbols="./artifacts/symbols/symbols-windows-x86_64-ucrt-${short_sha}"
          test -s "$symbols/omnirefl.exe.debug"
          test -s "$symbols/ccdb_query.exe.debug"
          (
            cd "$symbols"
            cmake -E tar cf \
              "$release_dir/omnirefl-windows-x86_64-ucrt-${version}-${short_sha}-symbols.zip" \
              --format=zip -- omnirefl.exe.debug ccdb_query.exe.debug
          )

          (
            cd "$release_dir"
            sha256sum omnirefl-* > SHA256SUMS
          )

          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Attest Release Assets
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.assets.outputs.directory }}/SHA256SUMS

      - name: Verify tag still names the validated commit
        run: |
          set -euo pipefail
          read -r kind commit < <(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object | [.type, .sha] | @tsv')
          # Annotated tags may point to another tag before reaching a commit.
          while [ tag = "$kind" ]; do
            read -r kind commit < <(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$commit" \
              --jq '.object | [.type, .sha] | @tsv')
          done
          if [ commit != "$kind" ] || [ "$GITHUB_SHA" != "$commit" ]; then
            echo "release tag moved; refusing assets validated for $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Create Draft Prerelease
        id: create_release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --prerelease \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --title "Omnirefl ${GITHUB_REF_NAME#v}"

      - name: Upload Release Assets
        id: upload_assets
        env:
          ASSET_DIR: ${{ steps.assets.outputs.directory }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET_DIR"/*

      # The create step succeeded in this run, so cleanup cannot delete a draft
      # created elsewhere during validation.
      - name: Remove Partial Draft
        if: >-
          ${{
            failure()
            && 'success' == steps.create_release.outcome
            && 'failure' == steps.upload_assets.outcome
          }}
        run: gh release delete "$GITHUB_REF_NAME" --yes
