name: Release
run-name: Release / ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    env:
      # Fine-grained token with read/write access to repository contents.
      GH_TOKEN: ${{ secrets.OMNIREFL_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Release Target
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OMNIREFL_RELEASE_TOKEN is not configured" >&2
            exit 1
          fi

          project_version=$(
            sed -n \
              '/^project(omnirefl/,/)/ s/^[[:space:]]*VERSION[[:space:]]\+\([^[:space:])]*\).*/\1/p' \
              CMakeLists.txt
          )
          if [ "v$project_version" != "$GITHUB_REF_NAME" ]; then
            printf 'release tag %s does not match project version %s\n' \
              "$GITHUB_REF_NAME" "$project_version" \
              >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi

  validation:
    name: Build and validate release
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      upload_symbols: true
    permissions:
      actions: write
      contents: read

  release:
    name: Create draft prerelease
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.OMNIREFL_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download Release Artifacts
        # Ad hoc: download-artifact currently fails for some artifacts uploaded
        # by Ubuntu runners. The REST download remains valid.
        # https://github.com/actions/upload-artifact/issues/811
        # REFACTORME: Restore download-artifact after the upstream fix ships.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          download_artifact() {
            local name=$1
            local destination=$2
            local artifact_id artifact_digest archive
            archive=$RUNNER_TEMP/$name.zip
            read -r artifact_id artifact_digest < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$name&per_page=1&direction=desc" \
                --jq '.artifacts[0] | [.id, .digest] | @tsv'
            )
            if [ -z "$artifact_id" ] || [ null = "$artifact_id" ]; then
              printf 'artifact was not found: %s\n' "$name" >&2
              return 1
            fi
            if [[ "$artifact_digest" != sha256:* ]]; then
              printf 'artifact has no SHA-256 digest: %s\n' "$name" >&2
              return 1
            fi

            mkdir -p "$destination"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$archive"
            printf '%s  %s\n' "${artifact_digest#sha256:}" "$archive" |
              sha256sum --check -
            unzip -q "$archive" -d "$destination"
            rm -f "$archive"
          }

          short_sha=${GITHUB_SHA::12}
          for target in \
            linux-x86_64-musl \
            linux-aarch64-musl \
            windows-x86_64-ucrt; do
            download_artifact \
              "packages-$target-$short_sha" \
              "./artifacts/packages/packages-$target-$short_sha"
            download_artifact \
              "symbols-$target-$short_sha" \
              "./artifacts/symbols/symbols-$target-$short_sha"
          done
          download_artifact \
            "packages-cosmo-universal-$short_sha" \
            "./artifacts/packages/packages-cosmo-universal-$short_sha"

      - name: Prepare Release Assets
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${GITHUB_REF_NAME#v}"
          short_sha="${GITHUB_SHA::12}"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"

          packages=(
            "omnirefl-linux-x86_64-musl-${version}-${short_sha}.deb"
            "omnirefl-linux-x86_64-musl-${version}-${short_sha}.tar.gz"
            "omnirefl-linux-aarch64-musl-${version}-${short_sha}.deb"
            "omnirefl-linux-aarch64-musl-${version}-${short_sha}.tar.gz"
            "omnirefl-windows-x86_64-ucrt-${version}-${short_sha}.zip"
            "omnirefl-cosmo-universal-${version}-${short_sha}.tar.gz"
          )

          for package in "${packages[@]}"; do
            matches=(./artifacts/packages/*/"$package")
            if [ 1 -ne "${#matches[@]}" ]; then
              echo "expected one $package, found ${#matches[@]}" >&2
              exit 1
            fi

            cp "${matches[0]}" "$release_dir/"
          done

          for target in linux-x86_64-musl linux-aarch64-musl; do
            symbols="./artifacts/symbols/symbols-${target}-${short_sha}"
            test -s "$symbols/omnirefl.debug"
            test -s "$symbols/ccdb_query.debug"
            tar -czf \
              "$release_dir/omnirefl-${target}-${version}-${short_sha}-symbols.tar.gz" \
              -C "$symbols" omnirefl.debug ccdb_query.debug
          done

          symbols="./artifacts/symbols/symbols-windows-x86_64-ucrt-${short_sha}"
          test -s "$symbols/omnirefl.exe.debug"
          test -s "$symbols/ccdb_query.exe.debug"
          (
            cd "$symbols"
            cmake -E tar cf \
              "$release_dir/omnirefl-windows-x86_64-ucrt-${version}-${short_sha}-symbols.zip" \
              --format=zip -- omnirefl.exe.debug ccdb_query.exe.debug
          )

          (
            cd "$release_dir"
            sha256sum omnirefl-* > SHA256SUMS
          )

          echo "directory=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Attest Release Assets
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.assets.outputs.directory }}/SHA256SUMS

      - name: Create Draft Prerelease
        id: create_release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --prerelease \
            --verify-tag \
            --generate-notes \
            --title "Omnirefl ${GITHUB_REF_NAME#v}"

      - name: Upload Release Assets
        id: upload_assets
        env:
          ASSET_DIR: ${{ steps.assets.outputs.directory }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET_DIR"/*

      # The create step succeeded in this run, so cleanup cannot delete a draft
      # created elsewhere during validation.
      - name: Remove Partial Draft
        if: >-
          ${{
            failure()
            && 'success' == steps.create_release.outcome
            && 'failure' == steps.upload_assets.outcome
          }}
        run: gh release delete "$GITHUB_REF_NAME" --yes
