services:
  build-linux:
    image: sergioeld/omnirefl-build-alpine
    build:
      context: .
      dockerfile: build-alpine.Dockerfile
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw
    working_dir: /build
    entrypoint:
      - /bin/ash
      - -euxc
      - |
        cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=ON \
          -DENABLE_BENCH=ON \
          -DClang_DIR=$${CLANG_INSTALL_LINUX}/lib/cmake/clang &&
        cmake --build . -t omnirefl -j$$(nproc) && # strip it before running tests 

        # split debug info into separate file
        mkdir -p symbols &&
        objcopy --only-keep-debug omnirefl symbols/omnirefl.debug &&

        # strip debug info from the main binary
        strip --strip-unneeded omnirefl &&

        # add link so debuggers can find the external debug file
        objcopy --add-gnu-debuglink=symbols/omnirefl.debug omnirefl

  build-windows:
    image: sergioeld/omnirefl-build-alpine
    build:
      context: .
      dockerfile: build-alpine.Dockerfile
    volumes:
      - ./:/src:ro
      - ./build-alpine/windows:/build:rw
    working_dir: /build
    # testing only possible in Windows container
    entrypoint:
      - /bin/ash
      - -euxc
      - |
        CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ LDFLAGS=-static \
          cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=OFF \
          -DClang_DIR=$${CLANG_INSTALL_WINDOWS}/lib/cmake/clang &&

        cmake --build . -t omnirefl.exe -j$$(nproc) &&

        # split debug info into separate file (PE/COFF)
        mkdir -p symbols &&
        x86_64-w64-mingw32-objcopy --only-keep-debug omnirefl.exe symbols/omnirefl.exe.debug &&

        # strip debug info from the main binary
        x86_64-w64-mingw32-strip --strip-unneeded omnirefl.exe &&

        # add link so debuggers can find the external debug file
        x86_64-w64-mingw32-objcopy --add-gnu-debuglink=symbols/omnirefl.exe.debug omnirefl.exe

  # todo: should move it to `test-ubuntu` matrix
  build-tests-alpine:
    image: sergioeld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw # ad hoc: must be rw for CTest (SMH)
      - ./build-alpine/test:/test:rw
    working_dir: /build
    entrypoint:
      - /bin/ash
      - -euxc
      - |
        ctest --parallel --output-junit alpine-results.xml -V | tee /test/alpine-results.log
        cp alpine-results.xml /test/

  package-linux:
    image: sergioeld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw # ad hoc: must be rw for CPack (SMH)
      - ./build-alpine/linux/install:/install:rw
    working_dir: /build
    entrypoint:
      - /bin/ash
      - -euxc
      - |
        mkdir -p /tmp/build
        cpack -G "DEB;TGZ" -B /tmp/build
        mv /tmp/build/*.deb /tmp/build/*.tar.gz /install/

  package-windows:
    image: sergioeld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/windows:/build:rw # ad hoc: must be rw for CPack (SMH)
      - ./build-alpine/windows/install:/install:rw
    working_dir: /build
    entrypoint:
      - /bin/ash
      - -euxc
      - |
        mkdir -p /tmp/build
        cpack -G "ZIP" -B /tmp/build
        mv /tmp/build/*.zip /install/

  # [18, 20, 22] [gcc, clang]
  test-ubuntu:
    image: sergioeld/test-install-ubuntu-$UBUNTU_VERSION-$COMPILER
    build:
      context: .
      dockerfile: test-install-ubuntu.Dockerfile
      args:
        UBUNTU_VERSION: $UBUNTU_VERSION
        COMPILER: $COMPILER
    volumes:
      - ./build-alpine/linux/install:/install:ro
      - ./build-alpine/test:/test:rw
    working_dir: /tmp/build
    entrypoint:
      - /bin/bash
      - -euxo
      - pipefail
      - -c
      - |
        apt install /install/omnirefl*.deb

        case $COMPILER in
          gcc) export CC=gcc; export CXX=g++ ;;
          clang) export CC=clang; export CXX=clang++ ;;
          mingw) export CC=x86_64-w64-mingw32-gcc; export CXX=x86_64-w64-mingw32-g++ ;;
          *) echo "Unsupported COMPILER='$COMPILER'" >&2; exit 1 ;;
        esac

        PREFIX=ubuntu-$UBUNTU_VERSION-$COMPILER-results

        cp -r /usr/share/omnirefl/tests/* ../
        cmake .. -GNinja

        set +e
        ctest --output-junit /test/$$PREFIX.xml -V 2>&1 | tee /test/$$PREFIX.log
        rc=$$?
        set -e

        if [ -n "$${DEBUG_SHELL:-}" ]; then
          echo "ctest rc=$$rc (DEBUG_SHELL set)"
          export CTEST_RC="$$rc"
          exec /bin/bash
        fi

        apt remove -y omnirefl
        exit $$rc

  # todo: mingw, clang, msvc clang
  test-windows:
    image: sergioeld/test-install-windows
    build:
      context: .
      dockerfile: test-install-windows.Dockerfile
    volumes:
      - ./build-alpine/windows/install:C:\install:ro
      - ./build-alpine/test:C:\test:rw
    working_dir: "C:/with space/build"
    command:
      - powershell
      - -Command
        |
        & {
        $$ErrorActionPreference = 'Stop'
        ; 7z x C:/install/omnirefl* -o'C:/with space/'
        ; cd 'C:/with space'
        ; mv ./omnirefl* ./omnirefl
        ; cp -r omnirefl/share/omnirefl/tests ./
        ; ./omnirefl/bin/omnirefl.exe -h
        ; cd 'C:/with space/build'
        ; cmake ../tests -GNinja -DCMAKE_BUILD_TYPE=Release -Domnirefl_DIR="C:/with space/omnirefl/lib/cmake/omnirefl"
        ; cmake --build . -j $$env:NUMBER_OF_PROCESSORS
        ; ctest . --output-junit C:/test/windows-results.xml -V | tee C:/test/windows-results.log
        ; exit $$LASTEXITCODE
        ;}

