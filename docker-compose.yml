# Local package-test entrypoints use the same public shape as CI:
#
#   TEST_PLATFORM=<alpine|ubuntu-18.04|ubuntu-20.04|ubuntu-22.04|windows>
#   TOOLCHAIN=<gcc|clang|mingw|msvc|clang-cl|msys2-mingw|msys2-clang>
#
# Linux package tests use TEST_PLATFORM + TOOLCHAIN to select the image.
# Alpine has a dedicated service because it unpacks the TGZ package instead of
# installing the DEB package. Windows tests use separate services where a
# matrix row needs a different image or shell, but still receive only TOOLCHAIN.
# Windows package tests intentionally install under `C:/with space` to catch
# path quoting regressions.
# When invoking `docker.exe compose` from WSL, export WINDOWS_PACKAGE_DIR,
# TEST_RESULTS_DIR, and TOOLCHAIN through WSLENV. Windows containers cannot bind
# mount WSL UNC paths, so package/results directories must be on a Windows drive.

services:
  build-linux:
    image: ghcr.io/sergio-eld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw
      - ${PACKAGE_DIR:-./artifacts/packages/linux}:/packages:rw
    working_dir: /build
    command:
      - /bin/ash
      - -euxc
      - |
        # Package validation runs from installed artifacts in test containers.
        # This build only needs to produce the tool and package files.
        cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=OFF \
          -DENABLE_BENCH=ON \
          -DClang_DIR=$${CLANG_INSTALL_LINUX}/lib/cmake/clang &&
        cmake --build . -t omnirefl ccdb_query -j$$(nproc) &&

        mkdir -p symbols &&
        objcopy --only-keep-debug omnirefl symbols/omnirefl.debug &&
        strip --strip-unneeded omnirefl &&
        (objcopy --remove-section .gnu_debuglink omnirefl 2>/dev/null || true) &&
        objcopy --add-gnu-debuglink=symbols/omnirefl.debug omnirefl &&

        mkdir -p /tmp/package /packages &&
        cpack -G "DEB;TGZ" -B /tmp/package &&
        mv /tmp/package/*.deb /tmp/package/*.tar.gz /packages/

  build-windows:
    image: ghcr.io/sergio-eld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/windows:/build:rw
      - ${PACKAGE_DIR:-./artifacts/packages/windows}:/packages:rw
    working_dir: /build
    command:
      - /bin/ash
      - -euxc
      - |
        # Package validation runs from installed artifacts in test containers.
        # This build only needs to produce the tool and package files.
        CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ LDFLAGS=-static \
          cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=OFF \
          -DClang_DIR=$${CLANG_INSTALL_WINDOWS}/lib/cmake/clang &&

        cmake --build . -t omnirefl.exe ccdb_query.exe -j$$(nproc) &&

        mkdir -p symbols &&
        x86_64-w64-mingw32-objcopy --only-keep-debug omnirefl.exe symbols/omnirefl.exe.debug &&
        x86_64-w64-mingw32-strip --strip-unneeded omnirefl.exe &&
        (x86_64-w64-mingw32-objcopy --remove-section .gnu_debuglink omnirefl.exe 2>/dev/null || true) &&
        x86_64-w64-mingw32-objcopy --add-gnu-debuglink=symbols/omnirefl.exe.debug omnirefl.exe &&

        mkdir -p /tmp/package /packages &&
        cpack -G "ZIP" -B /tmp/package &&
        mv /tmp/package/*.zip /packages/

  test-alpine:
    image: ghcr.io/sergio-eld/test-alpine
    build:
      context: .
      dockerfile: test-alpine.Dockerfile
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-gcc}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    volumes:
      - ${LINUX_PACKAGE_DIR:-./artifacts/packages/linux}:/packages:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/alpine-${TOOLCHAIN:-gcc}}:/results:rw
    working_dir: /tmp/build
    entrypoint:
      - /bin/ash
      - -euxc
      - |
        set -o pipefail
        mkdir -p /results /tmp/build /tmp/src /opt/omnirefl
        pkg=$$(find /packages -maxdepth 1 -name 'omnirefl-*.tar.gz' | sort | tail -n 1)
        test -n "$$pkg"
        tar -xzf "$$pkg" -C /opt/omnirefl --strip-components=1
        cp -r /opt/omnirefl/share/omnirefl/tests/* /tmp/src/

        CMAKE_FLAGS=""
        case $${TOOLCHAIN:-gcc} in
          gcc) export CC=gcc; export CXX=g++ ;;
          clang) export CC=clang; export CXX=clang++ ;;
          mingw)
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            CMAKE_FLAGS="-DCMAKE_SYSTEM_NAME=Windows"
            ;;
          *) echo "Unsupported TOOLCHAIN='$${TOOLCHAIN}'" >&2; exit 1 ;;
        esac

        PREFIX=alpine-$${TOOLCHAIN:-gcc}

        cmake /tmp/src -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -Domnirefl_DIR=/opt/omnirefl/lib/cmake/omnirefl \
          $$CMAKE_FLAGS

        set +e
        ctest --output-junit /results/$$PREFIX.xml -V 2>&1 | tee /results/$$PREFIX.log
        rc=$$?
        set -e

        mkdir -p /results/diagnostics
        cp -f CMakeCache.txt compile_commands.json /results/diagnostics/ 2>/dev/null || true
        cp -f Testing/Temporary/LastTest.log /results/diagnostics/ 2>/dev/null || true
        cp -f CMakeFiles/CMakeError.log /results/diagnostics/ 2>/dev/null || true
        find . -path './omni_*/*.omnirefl.hpp' -o -path './omni_*/*.omnirefl.hpp.d' \
          | tar -czf /results/diagnostics/generated-reflection.tar.gz -T - 2>/dev/null || true

        if [ 0 -ne "$$rc" ] && [ -n "$${KEEP_ALIVE_ON_FAILURE:-}" ]; then
          echo "ctest failed with rc=$$rc; keeping container alive"
          tail -f /dev/null
        fi

        exit $$rc

  test-ubuntu:
    image: ghcr.io/sergio-eld/test-${TEST_PLATFORM:-ubuntu-22.04}-${TOOLCHAIN:-gcc}
    build:
      context: .
      dockerfile: test-ubuntu.Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        COMPILER: ${TOOLCHAIN:-gcc}
    volumes:
      - ${LINUX_PACKAGE_DIR:-./artifacts/packages/linux}:/packages:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/${TEST_PLATFORM:-ubuntu-22.04}-${TOOLCHAIN:-gcc}}:/results:rw
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-gcc}
      TEST_PLATFORM: ${TEST_PLATFORM:-ubuntu-22.04}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    working_dir: /tmp/build
    entrypoint:
      - /bin/bash
      - -euxo
      - pipefail
      - -c
      - |
        mkdir -p /results
        apt install /packages/omnirefl*.deb

        CMAKE_FLAGS=""
        case $${TOOLCHAIN:-gcc} in
          gcc) export CC=gcc; export CXX=g++ ;;
          clang) export CC=clang; export CXX=clang++ ;;
          mingw)
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            CMAKE_FLAGS="-DCMAKE_SYSTEM_NAME=Windows"
            ;;
          *) echo "Unsupported TOOLCHAIN='$${TOOLCHAIN}'" >&2; exit 1 ;;
        esac

        PREFIX=$${TEST_PLATFORM:-ubuntu-22.04}-$${TOOLCHAIN:-gcc}

        cp -r /usr/share/omnirefl/tests/* /tmp/
        cmake /tmp -GNinja $$CMAKE_FLAGS

        set +e
        ctest --output-junit /results/$$PREFIX.xml -V 2>&1 | tee /results/$$PREFIX.log
        rc=$$?
        set -e

        mkdir -p /results/diagnostics
        cp -f CMakeCache.txt compile_commands.json /results/diagnostics/ 2>/dev/null || true
        cp -f Testing/Temporary/LastTest.log /results/diagnostics/ 2>/dev/null || true
        cp -f CMakeFiles/CMakeError.log /results/diagnostics/ 2>/dev/null || true
        find . -path './omni_*/*.omnirefl.hpp' -o -path './omni_*/*.omnirefl.hpp.d' \
          | tar -czf /results/diagnostics/generated-reflection.tar.gz -T - 2>/dev/null || true

        apt remove -y omnirefl

        if [ 0 -ne "$$rc" ] && [ -n "$${KEEP_ALIVE_ON_FAILURE:-}" ]; then
          echo "ctest failed with rc=$$rc; keeping container alive"
          tail -f /dev/null
        fi

        exit $$rc

  test-windows-msvc:
    image: ghcr.io/sergio-eld/test-windows-${TOOLCHAIN:-msvc}
    # Windows Docker Compose creates a new NAT network per project by default.
    # On the self-hosted runner those per-run networks can lose outbound
    # connectivity, so Windows package tests use Docker's existing `nat`.
    network_mode: nat
    build:
      context: .
      dockerfile: test-windows-msvc.Dockerfile
      args:
        TOOLCHAIN: ${TOOLCHAIN:-msvc}
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-msvc}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    volumes:
      - ${WINDOWS_PACKAGE_DIR:-./artifacts/packages/windows}:C:/install:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/windows-${TOOLCHAIN:-msvc}}:C:/test:rw
    working_dir: "C:/"
    entrypoint:
      - powershell
      - -NoLogo
      - -ExecutionPolicy
      - Bypass
      - -NoProfile
      - -Command
    command:
      - |
        $$ErrorActionPreference = 'Stop'
        $$vsEnv = cmd /c '"C:\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul && set'
        foreach ($$line in $$vsEnv) {
          if ($$line -match '^(.*?)=(.*)$$') {
            Set-Item -Path ('Env:' + $$matches[1]) -Value $$matches[2]
          }
        }

        New-Item -ItemType Directory -Force -Path 'C:/with space/build', 'C:/test', 'C:/test/diagnostics' | Out-Null
        $$package = Get-ChildItem -Path 'C:/install' -Filter 'omnirefl-*.zip' | Sort-Object Name | Select-Object -Last 1
        if ($$null -eq $$package) { throw 'Windows package artifact was not found in C:/install' }
        Expand-Archive -Path $$package.FullName -DestinationPath 'C:/with space' -Force

        Set-Location 'C:/with space'
        $$installRoot = Get-ChildItem -Directory -Filter 'omnirefl-*' | Select-Object -First 1
        if ($$null -eq $$installRoot) { throw 'could not find extracted omnirefl package root' }
        Move-Item $$installRoot.FullName ./omnirefl
        Copy-Item -Recurse omnirefl/share/omnirefl/tests ./
        ./omnirefl/bin/omnirefl.exe -h

        switch ($$env:TOOLCHAIN) {
          'msvc' {}
          'clang-cl' {
            $$env:Path = 'C:/Program Files/LLVM/bin;' + $$env:Path
            $$env:CC = 'clang-cl'
            $$env:CXX = 'clang-cl'
          }
          default { throw ('Unsupported TOOLCHAIN=' + $$env:TOOLCHAIN) }
        }

        Set-Location 'C:/with space/build'
        cmake ../tests -GNinja -DCMAKE_BUILD_TYPE=Release '-Domnirefl_DIR=C:/with space/omnirefl/lib/cmake/omnirefl'
        cmake --build . -j $$env:NUMBER_OF_PROCESSORS

        ctest . --output-junit C:/test/windows-$$env:TOOLCHAIN.xml -V 2>&1 |
          Tee-Object C:/test/windows-$$env:TOOLCHAIN.log
        $$rc = $$LASTEXITCODE

        Copy-Item -ErrorAction SilentlyContinue CMakeCache.txt, compile_commands.json C:/test/diagnostics/
        Copy-Item -ErrorAction SilentlyContinue Testing/Temporary/LastTest.log C:/test/diagnostics/
        Copy-Item -ErrorAction SilentlyContinue CMakeFiles/CMakeError.log C:/test/diagnostics/
        Get-ChildItem -Recurse -Include *.omnirefl.hpp, *.omnirefl.hpp.d -Path . |
          Compress-Archive -DestinationPath C:/test/diagnostics/generated-reflection.zip -Force

        if ((0 -ne $$rc) -and $$env:KEEP_ALIVE_ON_FAILURE) {
          Write-Host ('ctest failed with rc=' + $$rc + '; keeping container alive')
          while ($$true) { Start-Sleep -Seconds 3600 }
        }

        exit $$rc

  test-windows-msys2:
    image: ghcr.io/sergio-eld/test-windows-msys2
    # Windows Docker Compose creates a new NAT network per project by default.
    # On the self-hosted runner those per-run networks can lose outbound
    # connectivity, so Windows package tests use Docker's existing `nat`.
    network_mode: nat
    build:
      context: .
      dockerfile: test-windows-msys2.Dockerfile
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-msys2-mingw}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    volumes:
      - ${WINDOWS_PACKAGE_DIR:-./artifacts/packages/windows}:C:/install:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/windows-${TOOLCHAIN:-msys2-mingw}}:C:/test:rw
    working_dir: "C:/"
    entrypoint:
      - C:\tools\msys64\usr\bin\bash.exe
      - -lc
      - |
        set -euxo pipefail
        mkdir -p "/c/with space" /c/test/diagnostics
        pkg="$$(find /c/install -maxdepth 1 -name "omnirefl-*.zip" | sort | tail -n 1)"
        test -n "$$pkg"
        unzip -q "$$pkg" -d "/c/with space"

        cd "/c/with space"
        install_root="$$(find . -maxdepth 1 -type d -name "omnirefl-*" | sort | head -n 1)"
        test -n "$$install_root"
        mv "$$install_root" ./omnirefl
        cp -r omnirefl/share/omnirefl/tests ./
        ./omnirefl/bin/omnirefl.exe -h

        case $${TOOLCHAIN:-msys2-mingw} in
          msys2-mingw)
            export PATH=/mingw64/bin:/usr/bin:$$PATH
            export CC=gcc
            export CXX=g++
            ;;
          msys2-clang)
            export PATH=/clang64/bin:/usr/bin:$$PATH
            export CC=clang
            export CXX=clang++
            ;;
          *) echo "Unsupported TOOLCHAIN='$${TOOLCHAIN}'" >&2; exit 1 ;;
        esac

        mkdir -p "/c/with space/build"
        cd "/c/with space/build"
        cmake "../tests" -GNinja -DCMAKE_BUILD_TYPE=Release -Domnirefl_DIR="C:/with space/omnirefl/lib/cmake/omnirefl"
        cmake --build . -j"$$(nproc)"

        set +e
        ctest . --output-junit "/c/test/windows-$$TOOLCHAIN.xml" -V 2>&1 |
          tee "/c/test/windows-$$TOOLCHAIN.log"
        rc=$${PIPESTATUS[0]}
        set -e

        cp -f CMakeCache.txt compile_commands.json /c/test/diagnostics/ 2>/dev/null || true
        cp -f Testing/Temporary/LastTest.log /c/test/diagnostics/ 2>/dev/null || true
        cp -f CMakeFiles/CMakeError.log /c/test/diagnostics/ 2>/dev/null || true
        find . -name "*.omnirefl.hpp" -o -name "*.omnirefl.hpp.d" |
          tar -czf /c/test/diagnostics/generated-reflection.tar.gz -T - 2>/dev/null || true

        if [ 0 -ne "$$rc" ] && [ -n "$${KEEP_ALIVE_ON_FAILURE:-}" ]; then
          echo "ctest failed with rc=$$rc; keeping container alive"
          tail -f /dev/null
        fi

        exit "$$rc"
