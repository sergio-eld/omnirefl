services:
  build-linux:
    image: sergioeld/omnirefl-build-alpine
    build:
      context: .
      dockerfile: build-alpine.Dockerfile
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    # todo: debug symbols should be available
    command: 
      - |
        cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=ON \
          -DENABLE_BENCH=ON \
          -DClang_DIR=$${CLANG_INSTALL_LINUX}/lib/cmake/clang &&
        cmake --build . -t omnirefl -j$$(nproc) && # strip it before running tests 
        strip --strip-all omnirefl # set(CPACK_STRIP_FILES TRUE) doesn't work

  build-windows:
    image: sergioeld/omnirefl-build-alpine
    build:
      context: .
      dockerfile: build-alpine.Dockerfile
    volumes:
      - ./:/src:ro
      - ./build-alpine/windows:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    # todo: debug symbols should be available
    # testing only possible in Windows container
    command: 
      - |
        CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ LDFLAGS=-static \
          cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=OFF \
          -DClang_DIR=$${CLANG_INSTALL_WINDOWS}/lib/cmake/clang &&
        cmake --build . -t omnirefl.exe -j$$(nproc) && # strip it before running tests 
        strip --strip-all omnirefl.exe # set(CPACK_STRIP_FILES TRUE) doesn't work

  build-tests-alpine:
    image: sergioeld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    command: 
      - |
        mkdir -p /build/test/alpine &&
        ctest . --parallel --output-junit /build/test/alpine/results.xml \
          -V | tee /build/test/alpine/results.log

  package-linux:
    image: sergioeld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/linux:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    # todo: specify a directory which is easy to upload as artifact
    command: 
      - |
        cpack -G "DEB;TGZ" &&
        mkdir -p /build/install &&
        mv *.deb *.tar.gz /build/install/

  package-windows:
    image: sergioeld/omnirefl-build-alpine
    volumes:
      - ./:/src:ro
      - ./build-alpine/windows:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    # todo: specify a directory which is easy to upload as artifact
    command: 
      - |
        cpack -G "ZIP" &&
        mkdir -p /build/install &&
        mv *.zip /build/install/

  # [18, 20, 22] [gcc, clang]
  test-ubuntu:
    image: sergioeld/test-install-ubuntu-$UBUNTU_VERSION-$COMPILER
    build:
      context: .
      dockerfile: test-install-ubuntu.Dockerfile
      args:
        UBUNTU_VERSION: $UBUNTU_VERSION
        COMPILER: $COMPILER
    volumes:
      - ./build-alpine/linux/install:/install:ro
      - ./build:/build
    working_dir: /install
    entrypoint:
      - /bin/bash
      - -euxc
      - |
        apt install ./omnirefl*.deb

        case $COMPILER in
          gcc)
            export CC=gcc
            export CXX=g++
            ;;
          clang)
            export CC=clang
            export CXX=clang++
            ;;
          mingw)
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            ;;
          *)
            echo "Unsupported COMPILER='$COMPILER'" >&2
            exit 1
            ;;
        esac

        mkdir -p /tmp/test/build 
        cd /tmp/test/build
        cp -r /usr/share/omnirefl/tests/* ../
        cmake .. -GNinja

        mkdir -p /build/test
        ctest . --parallel \
          --output-junit /build/test/ubuntu-$UBUNTU_VERSION-$COMPILER-results.xml \
          -V | tee /build/test/ubuntu-$UBUNTU_VERSION-$COMPILER-results.log

        apt remove -y omnirefl

  # todo: mingw, clang, msvc clang
  test-windows:
    image: sergioeld/test-install-windows
    build:
      context: .
      dockerfile: test-install-windows.Dockerfile
    volumes:
      - ./build-alpine/windows/install:C:\install:ro
      - ./build:C:\build
    working_dir: C:/install
    command:
      - powershell
      - -Command
        |
        & {
        $$ErrorActionPreference = 'Stop'
        ; mkdir 'C:/with space/' 
        ; 7z x omnirefl* -o'C:/with space/'
        ; cd 'C:/with space'
        ; mv ./omnirefl* ./omnirefl
        ; cp -r omnirefl/share/omnirefl/tests ./
        ; ./omnirefl/bin/omnirefl.exe -h
        ; mkdir tests/build
        ; cd tests/build
        ; cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -Domnirefl_DIR="C:/with space/omnirefl/lib/cmake/omnirefl"
        ; cmake --build . -j $$nproc
        ; mkdir C:/build/test
        ; ctest . --output-junit C:/build/test/windows-results.xml -V | tee C:/build/test/windows-results.log
        ; exit $$LASTEXITCODE
        ;}

