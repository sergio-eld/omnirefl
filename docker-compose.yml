services:
  build:
    image: sergioeld/omnirefl-build-alpine
    build:
      context: .
      dockerfile: build-alpine.Dockerfile
    volumes:
      - ./:/src:ro
      - ./build-alpine:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    command: 
      - |
        cmake /src -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=ON \
          -DClang_DIR=$${CLANG_INSTALL_LINUX}/lib/cmake/clang &&
        cmake --build . -t omnirefl -j$$(nproc) && # strip it before running tests 
        strip --strip-all omnirefl # set(CPACK_STRIP_FILES TRUE) doesn't work

  # todo: test artifacts should be uploaded for continious testing
  build-tests:
    image: sergioeld/omnirefl-build-alpine
    # todo: this should be disabled for github CI
    depends_on:
      build:
        condition: service_completed_successfully
    volumes:
      - ./:/src:ro
      - ./build-alpine:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    command: 
      - |
        cmake --build . -j$$(nproc) &&
        ctest . -V

  install:
    image: sergioeld/omnirefl-build-alpine
    # todo: this should be disabled for github CI
    depends_on:
      build:
        condition: service_completed_successfully
    volumes:
      - ./:/src:ro
      - ./build-alpine:/build:rw
    working_dir: /build
    entrypoint: ['/bin/ash', '-c']
    # todo: specify a directory which is easy to upload as artifact
    command: 
      - |
        cpack -G "DEB;TGZ"

  test-ubuntu-18:
    image: test-install-ubuntu-18
    build:
      context: .
      dockerfile: test-install-ubuntu.Dockerfile
      args: 
        - UBUNTU_VERSION=18.04
    # todo: this should be disabled for github CI
    depends_on:
      install:
        condition: service_completed_successfully
    volumes:
      - ./build-alpine:/install:ro
    working_dir: /install
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        apt install ./omnirefl*.deb &&
        mkdir -p /tmp/test/build && cd /tmp/test/build
        cp -r /usr/share/omnirefl/samples/* ../
        cmake .. -GNinja &&
        cmake --build . &&
        ctest . -V

  test-ubuntu-22:
    image: test-install-ubuntu-22
    build:
      context: .
      dockerfile: test-install-ubuntu.Dockerfile
      args: 
        - UBUNTU_VERSION=22.04
    volumes:
      - ./build-alpine:/install:ro
    working_dir: /install
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        apt install ./omnirefl*.deb &&
        mkdir -p /tmp/test/build && cd /tmp/test/build
        cp -r /usr/share/omnirefl/samples/* ../
        cmake .. -GNinja &&
        cmake --build . &&
        ctest . -V


