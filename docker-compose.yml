# Local package-test entrypoints use the same public shape as CI:
#
#   UBUNTU_VERSION=<18.04|20.04|22.04>
#   TOOLCHAIN=<gcc|clang|mingw|msvc|clang-cl|msys2-mingw|msys2-clang>
#
# Ubuntu package tests and benchmarks use UBUNTU_VERSION + TOOLCHAIN to select
# the image. Alpine and Windows services receive only TOOLCHAIN.
# Package format and runtime are inferred from the package filename. Windows
# services remain separate where a toolchain needs a different image or shell.
# Windows package tests intentionally install under `C:/with space` to catch
# path quoting regressions.
# When invoking `docker.exe compose` from WSL, export PACKAGE_DIR,
# TEST_RESULTS_DIR, and TOOLCHAIN through WSLENV. Windows containers cannot bind
# mount WSL UNC paths, so package/results directories must be on a Windows drive.
#
# As of this writing, the committed .env file is the single source of truth for
# build/test image versions. Compose loads it automatically; shell variables
# may override it when testing another toolchain or distribution release.

x-build-musl-ucrt-image: &build-musl-ucrt-image
  platform: linux/amd64
  image: ghcr.io/sergio-eld/omnirefl-build-alpine-x86_64-musl-ucrt:llvm-${LLVM_VERSION}
  build:
    context: .
    dockerfile: docker/build-alpine-x86_64-musl-ucrt.Dockerfile
    args:
      LLVM_VERSION: ${LLVM_VERSION}

x-build-musl-aarch64-image: &build-musl-aarch64-image
  platform: linux/arm64
  image: ghcr.io/sergio-eld/omnirefl-build-alpine-aarch64-musl:llvm-${LLVM_VERSION}
  build:
    context: .
    dockerfile: docker/build-alpine-aarch64-musl.Dockerfile
    args:
      LLVM_VERSION: ${LLVM_VERSION}

x-build-musl-command: &build-musl-command
  - /bin/ash
  - -euxc
  - |
    # Package validation runs from installed artifacts in test containers.
    # This build only needs to produce the tool and package files.
    cmake /src -GNinja \
      -DCMAKE_BUILD_TYPE=$${CMAKE_BUILD_TYPE} \
      -DENABLE_PACKAGE=ON \
      -DENABLE_TESTING=OFF \
      -DENABLE_BENCH=OFF \
      -DOMNIREFL_PACKAGE_COMMIT=${PACKAGE_COMMIT:-} \
      -DClang_DIR=$${CLANG_INSTALL_LINUX}/lib/cmake/clang &&
    cmake --build . -t omnirefl ccdb_query -j$$(nproc) &&

    mkdir -p symbols
    for binary in omnirefl ccdb_query; do
      objcopy --only-keep-debug "$$binary" "symbols/$$binary.debug"
      strip --strip-unneeded "$$binary"
      objcopy --remove-section .gnu_debuglink "$$binary" 2>/dev/null || true
      objcopy --add-gnu-debuglink="symbols/$$binary.debug" "$$binary"
    done

    mkdir -p /tmp/package /packages
    cpack -G "DEB;TGZ" -B /tmp/package
    mv /tmp/package/*.deb /tmp/package/*.tar.gz /packages/

x-test-linux-command: &test-linux-command |
  set -- /packages/*.tar.gz
  if [ "$$#" -ne 1 ] || [ ! -f "$$1" ]; then
    echo 'Expected exactly one package in /packages' >&2
    exit 1
  fi
  package=$$1
  set --
  case $${TOOLCHAIN} in
    gcc) export CC=gcc; export CXX=g++ ;;
    clang) export CC=clang; export CXX=clang++ ;;
    mingw)
      export CC=x86_64-w64-mingw32-gcc
      export CXX=x86_64-w64-mingw32-g++
      set -- --cmake-arg -DCMAKE_SYSTEM_NAME=Windows
      ;;
    *) echo "Unsupported TOOLCHAIN='$${TOOLCHAIN}'" >&2; exit 1 ;;
  esac

  exec "$$PACKAGE_TEST_SHELL" /runner/test_package.sh \
    --package "$$package" \
    --name "$$TEST_NAME" \
    --results /results \
    "$$@"

services:
  build-cosmo:
    # Keep COSMOPOLITAN_* and cosmopolitan.cmake aligned with the upstream
    # toolchain name; project-owned services, images, paths, and packages use
    # the shorter `cosmo` runtime name.
    platform: linux/amd64
    image: ghcr.io/sergio-eld/omnirefl-build-cosmo:universal-${COSMOPOLITAN_VERSION}-llvm-${LLVM_VERSION}
    build:
      context: .
      dockerfile: docker/build-alpine-cosmo.Dockerfile
      args:
        COSMOPOLITAN_VERSION: ${COSMOPOLITAN_VERSION}
        LLVM_VERSION: ${LLVM_VERSION}
    volumes:
      - ./:/src:ro
      - ./build-alpine/cosmo/${COSMOPOLITAN_VERSION}-llvm-${LLVM_VERSION}:/build:rw
      - ${PACKAGE_DIR:-./artifacts/packages/cosmo}:/packages:rw
    working_dir: /build
    command:
      - /bin/ash
      - -euxc
      - |
        cmake /src -GNinja \
          -B /build/x86_64 \
          -DCMAKE_TOOLCHAIN_FILE=/src/docker/cosmopolitan.cmake \
          -DCOSMOPOLITAN_ARCH=x86_64 \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_PACKAGE=ON \
          -DENABLE_TESTING=OFF \
          -DENABLE_BENCH=OFF \
          -DOMNIREFL_PACKAGE_COMMIT=${PACKAGE_COMMIT:-} \
          -DOMNIREFL_PACKAGE_TARGET=cosmo-universal \
          -DClang_DIR=$${CLANG_INSTALL_COSMOPOLITAN_X86_64}/lib/cmake/clang \
          -DLLVM_DIR=$${CLANG_INSTALL_COSMOPOLITAN_X86_64}/lib/cmake/llvm \
          -DCLANG_RESOURCE_DIR=$${CLANG_RESOURCE_DIR_COSMOPOLITAN} &&

        cmake /src -GNinja \
          -B /build/aarch64 \
          -DCMAKE_TOOLCHAIN_FILE=/src/docker/cosmopolitan.cmake \
          -DCOSMOPOLITAN_ARCH=aarch64 \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_PACKAGE=OFF \
          -DENABLE_TESTING=OFF \
          -DENABLE_BENCH=OFF \
          -DOMNIREFL_PACKAGE_COMMIT=${PACKAGE_COMMIT:-} \
          -DClang_DIR=$${CLANG_INSTALL_COSMOPOLITAN_AARCH64}/lib/cmake/clang \
          -DLLVM_DIR=$${CLANG_INSTALL_COSMOPOLITAN_AARCH64}/lib/cmake/llvm \
          -DCLANG_RESOURCE_DIR=$${CLANG_RESOURCE_DIR_COSMOPOLITAN} &&

        cmake --build /build/x86_64 -t omnirefl ccdb_query -j$$(nproc) &&
        cmake --build /build/aarch64 -t omnirefl ccdb_query -j$$(nproc) &&
        bash /src/docker/package-cosmo.sh \
          /build/x86_64 /build/aarch64 /packages

  build-musl:
    <<: *build-musl-ucrt-image
    environment:
      CMAKE_BUILD_TYPE: RelWithDebInfo
    volumes:
      - ./:/src:ro
      - ./build-alpine/musl/x86_64/llvm-${LLVM_VERSION}:/build:rw
      - ${PACKAGE_DIR:-./artifacts/packages/musl}:/packages:rw
    working_dir: /build
    command: *build-musl-command

  build-musl-aarch64:
    <<: *build-musl-aarch64-image
    environment:
      CMAKE_BUILD_TYPE: RelWithDebInfo
    volumes:
      - ./:/src:ro
      - ./build-alpine/musl/aarch64/llvm-${LLVM_VERSION}:/build:rw
      - ${PACKAGE_DIR:-./artifacts/packages/musl}:/packages:rw
    working_dir: /build
    command: *build-musl-command

  build-ucrt:
    <<: *build-musl-ucrt-image
    volumes:
      - ./:/src:ro
      - ./build-alpine/ucrt/x86_64/llvm-${LLVM_VERSION}:/build:rw
      - ${PACKAGE_DIR:-./artifacts/packages/ucrt}:/packages:rw
    working_dir: /build
    command:
      - /bin/ash
      - -euxc
      - |
        # Package validation runs from installed artifacts in test containers.
        # This build only needs to produce the tool and package files.
        CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ LDFLAGS=-static \
          cmake /src -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DENABLE_PACKAGE=ON \
            -DENABLE_TESTING=OFF \
            -DENABLE_BENCH=OFF \
            -DOMNIREFL_PACKAGE_COMMIT=${PACKAGE_COMMIT:-} \
            -DClang_DIR=$${CLANG_INSTALL_WINDOWS}/lib/cmake/clang &&

        cmake --build . -t omnirefl.exe ccdb_query.exe -j$$(nproc) &&

        mkdir -p symbols
        for binary in omnirefl.exe ccdb_query.exe; do
          x86_64-w64-mingw32-objcopy \
            --only-keep-debug "$$binary" "symbols/$$binary.debug"
          x86_64-w64-mingw32-strip --strip-unneeded "$$binary"
          x86_64-w64-mingw32-objcopy \
            --remove-section .gnu_debuglink "$$binary" 2>/dev/null || true
          x86_64-w64-mingw32-objcopy \
            --add-gnu-debuglink="symbols/$$binary.debug" "$$binary"
        done

        mkdir -p /tmp/package /packages
        cpack -G "ZIP" -B /tmp/package
        mv /tmp/package/*.zip /packages/

  test-alpine:
    image: ghcr.io/sergio-eld/omnirefl-test-alpine:${ALPINE_VERSION}-x86_64-${TOOLCHAIN:-gcc}
    build:
      context: .
      dockerfile: docker/test-alpine.Dockerfile
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
        COMPILER: ${TOOLCHAIN:-gcc}
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-gcc}
      PACKAGE_TEST_SHELL: /bin/ash
      TEST_NAME: ${TEST_NAME:-alpine-x86_64-${TOOLCHAIN:-gcc}}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    volumes:
      - ${PACKAGE_DIR:-./artifacts/packages/current}:/packages:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/alpine-x86_64-${TOOLCHAIN:-gcc}}:/results:rw
      - ./ci:/runner:ro
    working_dir: /tmp/build
    entrypoint:
      - /bin/ash
      - -euxc
      - *test-linux-command

  test-alpine-aarch64:
    extends:
      service: test-alpine
    platform: linux/arm64
    image: ghcr.io/sergio-eld/omnirefl-test-alpine:${ALPINE_VERSION}-aarch64-${TOOLCHAIN:-gcc}
    environment:
      TEST_NAME: ${TEST_NAME:-alpine-aarch64-${TOOLCHAIN:-gcc}}
    volumes:
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/alpine-aarch64-${TOOLCHAIN:-gcc}}:/results:rw

  test-ubuntu:
    image: &test-ubuntu-x86-image ghcr.io/sergio-eld/omnirefl-test-ubuntu:${UBUNTU_VERSION}-x86_64-${TOOLCHAIN:-gcc}
    build:
      context: .
      dockerfile: docker/test-ubuntu.Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION}
        COMPILER: ${TOOLCHAIN:-gcc}
    volumes:
      - ${PACKAGE_DIR:-./artifacts/packages/current}:/packages:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/ubuntu-${UBUNTU_VERSION}-x86_64-${TOOLCHAIN:-gcc}}:/results:rw
      - ./ci:/runner:ro
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-gcc}
      PACKAGE_TEST_SHELL: /bin/bash
      TEST_NAME: ${TEST_NAME:-ubuntu-${UBUNTU_VERSION}-x86_64-${TOOLCHAIN:-gcc}}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    working_dir: /tmp/build
    entrypoint:
      - /bin/bash
      - -euxo
      - pipefail
      - -c
      - *test-linux-command

  test-ubuntu-aarch64:
    extends:
      service: test-ubuntu
    platform: linux/arm64
    image: ghcr.io/sergio-eld/omnirefl-test-ubuntu:${UBUNTU_VERSION}-aarch64-${TOOLCHAIN:-gcc}
    environment:
      TEST_NAME: ${TEST_NAME:-ubuntu-${UBUNTU_VERSION}-aarch64-${TOOLCHAIN:-gcc}}
    volumes:
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/ubuntu-${UBUNTU_VERSION}-aarch64-${TOOLCHAIN:-gcc}}:/results:rw

  benchmark:
    image: *test-ubuntu-x86-image
    environment:
      BENCHMARK_NAME: ${BENCHMARK_NAME:-}
      TOOLCHAIN: ${TOOLCHAIN:-gcc}
    volumes:
      - ${PACKAGE_DIR:-./artifacts/packages/musl}:/packages:ro
      - ${TEST_RESULTS_DIR:-./artifacts/benchmarks}:/results:rw
      - ${BUILD_DIR:-./artifacts/benchmark-build}:/benchmark:rw
      - ./ci:/runner:ro
    working_dir: /benchmark
    entrypoint:
      - /bin/bash
      - -euo
      - pipefail
      - -c
      - |
        trap 'chmod -R a+rwX /results /benchmark 2>/dev/null || true' EXIT
        rm -rf /benchmark/run
        mkdir -p /benchmark/run/build /results

        packages=(/packages/*.tar.gz)
        test 1 -eq "$${#packages[@]}"
        test -f "$${packages[0]}"

        case "$$(basename "$${packages[0]}")" in
          *-musl-*) package_runtime=musl ;;
          *-cosmo-*) package_runtime=cosmo ;;
          *) echo "Cannot infer package runtime" >&2; exit 1 ;;
        esac

        mkdir -p /benchmark/run/archive
        tar -xzf "$${packages[0]}" -C /benchmark/run/archive
        package_roots=(/benchmark/run/archive/omnirefl-*)
        test 1 -eq "$${#package_roots[@]}"
        test -d "$${package_roots[0]}"
        install="$${package_roots[0]}"

        exec /runner/benchmark_package.sh \
          --install "$$install" \
          --build /benchmark/run/build \
          --results /results \
          --name "$${BENCHMARK_NAME:-linux-$$(uname -m)-$$package_runtime-$${TOOLCHAIN:-gcc}}"

  test-windows-msvc:
    image: ghcr.io/sergio-eld/omnirefl-test-windows:ltsc2019-x86_64-${TOOLCHAIN:-msvc}
    # Windows Docker Compose creates a new NAT network per project by default.
    # On the local Windows Docker host those per-run networks can lose outbound
    # connectivity, so Windows package tests use Docker's existing `nat`.
    network_mode: nat
    build:
      context: .
      dockerfile: docker/test-windows-msvc.Dockerfile
      args:
        TOOLCHAIN: ${TOOLCHAIN:-msvc}
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-msvc}
      TEST_NAME: ${TEST_NAME:-windows-${TOOLCHAIN:-msvc}}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    volumes:
      - ./ci:C:/runner:ro
      - ${PACKAGE_DIR:-./artifacts/packages/ucrt}:C:/install:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/windows-${TOOLCHAIN:-msvc}}:C:/test:rw
    working_dir: "C:/"
    entrypoint:
      - powershell
      - -NoLogo
      - -ExecutionPolicy
      - Bypass
      - -NoProfile
      - -Command
    command:
      - |
        $$ErrorActionPreference = 'Stop'
        $$vsEnv = cmd /c '"C:\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul && set'
        foreach ($$line in $$vsEnv) {
          if ($$line -match '^(.*?)=(.*)$$') {
            Set-Item -Path ('Env:' + $$matches[1]) -Value $$matches[2]
          }
        }

        $$packages = @(ls -Path 'C:/install' -File | Where-Object {
          $$_.Name.EndsWith('.zip') -or $$_.Name.EndsWith('.tar.gz')
        })
        if (1 -ne $$packages.Count) { throw 'expected one package in C:/install' }

        switch ($$env:TOOLCHAIN) {
          'msvc' {}
          'clang-cl' {
            $$env:Path = 'C:/Program Files/LLVM/bin;' + $$env:Path
            $$env:CC = 'clang-cl'
            $$env:CXX = 'clang-cl'
          }
          default { throw ('Unsupported TOOLCHAIN=' + $$env:TOOLCHAIN) }
        }

        & C:/runner/test_package.ps1 `
          -Package $$packages[0].FullName `
          -Name $$env:TEST_NAME `
          -Results C:/test
        exit $$LASTEXITCODE

  test-windows-msys2:
    image: ghcr.io/sergio-eld/omnirefl-test-windows:ltsc2019-x86_64-msys2
    # Windows Docker Compose creates a new NAT network per project by default.
    # On the local Windows Docker host those per-run networks can lose outbound
    # connectivity, so Windows package tests use Docker's existing `nat`.
    network_mode: nat
    build:
      context: .
      dockerfile: docker/test-windows-msys2.Dockerfile
    environment:
      TOOLCHAIN: ${TOOLCHAIN:-msys2-mingw}
      TEST_NAME: ${TEST_NAME:-windows-${TOOLCHAIN:-msys2-mingw}}
      KEEP_ALIVE_ON_FAILURE: ${KEEP_ALIVE_ON_FAILURE:-}
    volumes:
      - ./ci:C:/runner:ro
      - ${PACKAGE_DIR:-./artifacts/packages/ucrt}:C:/install:ro
      - ${TEST_RESULTS_DIR:-./artifacts/test-results/windows-${TOOLCHAIN:-msys2-mingw}}:C:/test:rw
    working_dir: "C:/"
    entrypoint:
      - C:\tools\msys64\usr\bin\bash.exe
      - -lc
      - |
        set -euxo pipefail
        shopt -s nullglob
        packages=(/c/install/*.zip /c/install/*.tar.gz)
        test 1 -eq "$${#packages[@]}"

        case $${TOOLCHAIN:-msys2-mingw} in
          msys2-mingw)
            export PATH=/mingw64/bin:/usr/bin:$$PATH
            export CC=gcc
            export CXX=g++
            ;;
          msys2-clang)
            export PATH=/clang64/bin:/usr/bin:$$PATH
            export CC=clang
            export CXX=clang++
            ;;
          *) echo "Unsupported TOOLCHAIN='$${TOOLCHAIN}'" >&2; exit 1 ;;
        esac

        exec bash /c/runner/test_package.sh \
          --package "$${packages[0]}" \
          --name "$$TEST_NAME" \
          --results /c/test
